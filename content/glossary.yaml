- slug: transaction
  term:
    ja: トランザクション
    en: transaction
  definition:
    ja: アプリケーションが行う複数の読み書きを1つの単位としてまとめ、途中経過を隠したままデータベースに実行させる仕組み。
    en: A mechanism that lets an application group several reads and writes into a single unit, hiding any intermediate state from the outside.

- slug: acid
  term:
    ja: ACID
    en: ACID
  definition:
    ja: トランザクションが満たすべき4つの性質(原子性・一貫性・分離性・永続性)の頭文字をまとめた呼び方。実装によってどこまで厳密に満たすかは幅がある。
    en: An acronym for the four properties a transaction is expected to provide (atomicity, consistency, isolation, durability). How strictly each is provided varies by implementation.

- slug: isolation-level
  term:
    ja: 分離レベル
    en: isolation level
  definition:
    ja: 複数のトランザクションを同時に実行したときに、どの種類の異常(ダーティリードやスキューなど)を防ぐかの強さを表す段階。強いほど異常は減るが同時実行の自由度は下がる。
    en: A setting that determines how strongly a database prevents anomalies (such as dirty reads or skew) when transactions run concurrently. Stronger levels prevent more anomalies at the cost of concurrency.

- slug: dirty-read
  term:
    ja: ダーティリード
    en: dirty read
  definition:
    ja: あるトランザクションがまだコミットしていない書き込みを、別のトランザクションが読み取ってしまう異常。
    en: An anomaly where a transaction reads a write made by another transaction that has not committed yet.

- slug: dirty-write
  term:
    ja: ダーティライト
    en: dirty write
  definition:
    ja: 2つのトランザクションが同じデータへ同時に書き込み、片方のコミット前の書き込みがもう片方に上書きされて失われてしまう異常。
    en: An anomaly where two transactions write to the same data concurrently and one transaction's uncommitted write is overwritten and lost.

- slug: read-skew
  term:
    ja: 読み取りスキュー
    en: read skew
  definition:
    ja: 1つのトランザクションが複数の値を読む間に別のトランザクションがその一部だけを更新・コミットしてしまい、矛盾した組み合わせの値が観測される異常。
    en: An anomaly where, while one transaction reads multiple values, another transaction commits an update to only some of them, causing an inconsistent combination to be observed.

- slug: write-skew
  term:
    ja: 書き込みスキュー
    en: write skew
  definition:
    ja: 複数のトランザクションがそれぞれ関連する値を読み取り、その内容に基づいて別々のオブジェクトへ書き込んだ結果、個々の書き込みは問題なくてもアプリケーションの不変条件を破ってしまう異常。
    en: An anomaly where multiple transactions each read related data and write to different objects based on it, so that each write looks fine alone but the combination violates an application invariant.

- slug: serializability
  term:
    ja: 直列化可能性
    en: serializability
  definition:
    ja: 複数のトランザクションを同時に実行した結果が、それらを何らかの順番で1つずつ実行した場合と同じになるという性質。
    en: The property that the result of running multiple transactions concurrently matches the result of running them one at a time in some order.

- slug: two-phase-locking
  term:
    ja: 2相ロック
    en: two-phase locking
  definition:
    ja: トランザクションがデータを読み書きする前にロックを取得し、コミットまで保持してから一括で解放する悲観的な直列化可能性の実現方式。ロックを解放した後は新たなロックを獲得しない。
    en: A pessimistic approach to serializability where a transaction acquires locks before accessing data, holds them until commit, and releases them all together; no new lock may be acquired after releasing has begun.

- slug: snapshot-isolation
  term:
    ja: スナップショット分離
    en: snapshot isolation
  definition:
    ja: トランザクション開始時点のデータベース全体の一貫したスナップショットを見せる分離レベル。読み取りスキューを防ぐが、書き込みスキューまでは防がない。
    en: An isolation level that gives each transaction a consistent snapshot of the whole database as of when it started. It prevents read skew, but not write skew.

- slug: partitioning
  term:
    ja: パーティショニング
    en: partitioning
  definition:
    ja: 1つの大きなデータセットを複数の独立した区画(パーティション)に分割し、別々のノードに配置する設計手法。1台に載り切らない量のデータやリクエストを、複数台で分担してさばけるようにする。
    en: A design technique that splits one large dataset into independent chunks (partitions) placed on separate nodes, so data volume and request load that would not fit on a single machine can be shared across many.
- slug: key-range-partitioning
  term:
    ja: キーレンジ分割
    en: key-range partitioning
  definition:
    ja: キーの取りうる値を連続した範囲に区切り、各範囲を1つのパーティションに割り当てる分割方式。範囲スキャン(「AからBまでのキーを順に読む」)が得意な一方、範囲の境界をどこに置くかを運用側で継続的に調整する必要がある。
    en: A partitioning scheme that divides the key space into contiguous ranges and assigns each range to a partition. It is efficient for range scans (reading keys from A to B in order), but the range boundaries need ongoing operational tuning.
- slug: hash-partitioning
  term:
    ja: ハッシュ分割
    en: hash partitioning
  definition:
    ja: キーをハッシュ関数に通した出力値をもとにパーティションを決める分割方式。似た値のキーが同じ範囲に固まらないため負荷が均されやすいが、範囲スキャンでは複数パーティションへの問い合わせが必要になりやすい。
    en: A partitioning scheme that assigns a partition based on the output of a hash function applied to the key. Similar keys no longer cluster together, which tends to spread load evenly, but range scans typically need to query multiple partitions.
- slug: consistent-hashing
  term:
    ja: コンシステントハッシュ
    en: consistent hashing
  definition:
    ja: ノードとキーの両方を同じハッシュ空間(リング)上に配置し、キーをリング上で最も近いノードに割り当てる方式。ノード数の増減時に再配置されるキーの範囲を、単純なハッシュ値のmod演算による分割よりも小さく抑えられる。
    en: A scheme that maps both nodes and keys onto the same hash space (a ring) and assigns each key to the nearest node on the ring. It keeps the range of keys that get reassigned when nodes are added or removed much smaller than a plain modulo-based hash split.
- slug: virtual-node
  term:
    ja: 仮想ノード
    en: virtual node
  definition:
    ja: コンシステントハッシュのリング上で、1つの物理ノードを複数の点(仮想ノード、vnode)として配置する仕組み。物理ノードあたりの点数を増やすほどキーの割り当てが均等になりやすく、ノード追加・削除時の負荷差も小さくなる。
    en: A mechanism in consistent hashing where a single physical node is represented by multiple points (virtual nodes, or vnodes) on the ring. Increasing the number of points per physical node tends to make key assignment more even and shrinks the load imbalance caused by adding or removing nodes.
- slug: hotspot
  term:
    ja: ホットスポット
    en: hotspot
  definition:
    ja: 特定のキーやパーティションにアクセスが偏り、そのノードだけ負荷が突出する状態。分割方式を変えても、著名人アカウントのような単一キーへの集中アクセスは解消できない場合がある。
    en: A state where access concentrates on a specific key or partition, causing load on that one node to spike far above the others. Changing the partitioning scheme alone cannot always fix this — concentrated access to a single key, such as a celebrity account, can remain a hotspot regardless.
- slug: rebalancing
  term:
    ja: リバランス
    en: rebalancing
  definition:
    ja: ノードの追加・削除やデータ量の偏りに応じて、パーティションの担当ノードを移動し直す運用作業。自動化するとオペレーターの手間は減るが、意図しないタイミングで大量のデータ移動が走り性能に影響するリスクがある。
    en: The operational process of moving partition ownership between nodes in response to nodes being added or removed, or to uneven data growth. Automating it reduces operator effort, but risks triggering large, unplanned data transfers that hurt performance at an inconvenient time.
