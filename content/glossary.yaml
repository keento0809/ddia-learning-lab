- slug: network-partition
  term:
    ja: "ネットワーク分断"
    en: "network partition"
  definition:
    ja: "ネットワークの一部の通信経路が切断や輻輳などで途絶し、ノード群が複数のグループに分かれて相互に通信できなくなる状態。"
    en: "A state in which a subset of network links fails or becomes congested, splitting nodes into groups that cannot communicate with each other."

- slug: asynchronous-network
  term:
    ja: "非同期ネットワーク"
    en: "asynchronous network"
  definition:
    ja: "メッセージの到達順序や遅延時間に上限の保証がないネットワークモデル。パケットが遅延・再順序化・喪失しうることを前提に設計する必要がある。"
    en: "A network model that offers no guaranteed bound on message ordering or delivery time; packets may be delayed, reordered, or lost, so systems must be designed to tolerate this."

- slug: false-positive-detection
  term:
    ja: "誤検知(フォールスポジティブ)"
    en: "false positive (failure detection)"
  definition:
    ja: "実際には正常に稼働しているノードを、タイムアウトなどの検出基準によって誤って「停止した」と判定してしまうこと。"
    en: "Mistakenly classifying a node that is actually still running as failed, based on a detection heuristic such as a timeout."

- slug: wall-clock-time
  term:
    ja: "壁時計時刻"
    en: "wall-clock time"
  definition:
    ja: "OSが提供する、実世界のカレンダー時刻(現在の日時)を返すクロック。NTPなどによる同期補正で値が前後に飛ぶことがあるため経過時間の計測には向かず、時刻そのものの記録・表示に用途を限るべきとされる。"
    en: "A clock, provided by the operating system, that returns real-world calendar time (the current date and time). Because periodic NTP synchronization can make its value jump forward or backward, it is unsuited to measuring elapsed time and should be reserved for recording or displaying the time itself."

- slug: clock-drift
  term:
    ja: "クロックドリフト"
    en: "clock drift"
  definition:
    ja: "各マシンの水晶発振器の個体差や温度変化などにより、実時間に対して時計の進み方に生じるずれ。時間の経過とともに誤差が蓄積する。"
    en: "The gradual divergence of a machine's clock from true elapsed time, caused by variation in its quartz oscillator and environmental factors such as temperature; the error accumulates over time."

- slug: monotonic-clock
  term:
    ja: "単調クロック"
    en: "monotonic clock"
  definition:
    ja: "時刻同期の補正やユーザー操作の影響を受けず、常に前進し続けることが保証されたクロック。経過時間の計測に適する。"
    en: "A clock guaranteed to always move forward and never be adjusted backward by synchronization or manual changes; well suited to measuring elapsed durations."

- slug: gc-pause
  term:
    ja: "GCポーズ"
    en: "GC pause"
  definition:
    ja: "ガベージコレクションの実行中にアプリケーションのスレッドが一時的に停止する現象。停止時間はヒープサイズや実装により数ミリ秒から数秒以上に及ぶことがある。"
    en: "A pause during which application threads are suspended while the garbage collector runs; the duration can range from milliseconds to several seconds or more depending on heap size and implementation."

- slug: fencing-token
  term:
    ja: "フェンシングトークン"
    en: "fencing token"
  definition:
    ja: "リースや分散ロックを取得するたびに発行される単調増加するトークン。資源側(ストレージなど)がそのトークンを検証し、より新しいトークンを持つ保持者の書き込みだけを受け付けることで、一時停止から復帰した古いリース保持者による誤った書き込みを防ぐ。"
    en: "A monotonically increasing token issued each time a lease or distributed lock is acquired. The protected resource (such as storage) checks this token and accepts writes only from the holder presenting the newest one, preventing an old lease holder that resumes after a pause from writing incorrectly."

- slug: byzantine-fault
  term:
    ja: "ビザンチン障害"
    en: "Byzantine fault"
  definition:
    ja: "ノードが単に停止するのではなく、矛盾したメッセージを送ったりプロトコルに反する挙動をしたりするなど、任意かつ予測不能な形で誤動作する障害モデル。"
    en: "A fault model in which a node misbehaves in arbitrary and unpredictable ways, such as sending inconsistent messages or violating the protocol, rather than simply stopping."

- slug: leader-based-replication
  term:
    ja: リーダーベースレプリケーション
    en: leader-based replication
  definition:
    ja: 複製先のノードのうち1台をリーダーに指定し、書き込みは必ずリーダーを経由してから他のフォロワーへ伝搬する構成。
    en: A replication setup where one node is designated the leader; writes always go through it and are then propagated to the other follower nodes.
- slug: synchronous-replication
  term:
    ja: 同期レプリケーション
    en: synchronous replication
  definition:
    ja: リーダーが少なくとも1台のフォロワーへの反映を確認してから、クライアントへ書き込み成功を返すレプリケーション方式。
    en: A replication mode where the leader waits for at least one follower to confirm applying a write before reporting success to the client.
- slug: asynchronous-replication
  term:
    ja: 非同期レプリケーション
    en: asynchronous replication
  definition:
    ja: リーダーがフォロワーへの反映を待たずにクライアントへ書き込み成功を返すレプリケーション方式。低レイテンシだが、直後の障害で未反映の変更が失われる可能性がある。
    en: A replication mode where the leader reports success to the client without waiting for followers to apply the write. Low latency, but an immediate leader failure can lose unpropagated writes.
- slug: replication-lag
  term:
    ja: レプリケーションラグ
    en: replication lag
  definition:
    ja: 非同期レプリケーションにおいて、リーダーに書き込まれた変更があるフォロワーにまだ反映されていない時間差のこと。
    en: In asynchronous replication, the time delay between a change being written on the leader and that change being applied on a given follower.
- slug: read-your-writes
  term:
    ja: read-your-writes一貫性
    en: read-your-writes consistency
  definition:
    ja: 利用者が自分自身で行った書き込みの直後に自分で読み取ったとき、その書き込みが必ず反映されているという期待のこと。
    en: The expectation that a user who just made a write will always see that write reflected when they read immediately afterward.
- slug: monotonic-reads
  term:
    ja: monotonic reads(単調読み取り)一貫性
    en: monotonic reads consistency
  definition:
    ja: 一度読み取った内容より古い状態を、あとから読み取ることはないという期待のこと。読み取りごとに接続先レプリカが変わる構成で崩れやすい。
    en: The expectation that, once a user has seen data at some point in time, they never later see an older state. Easily broken when consecutive reads land on different replicas.
- slug: consistent-prefix-reads
  term:
    ja: consistent prefix reads(一貫した前方読み取り)一貫性
    en: consistent prefix reads consistency
  definition:
    ja: 因果的に関連した書き込みの並びが、読み取り側にもその順序どおりに見えるという期待のこと。
    en: The expectation that a sequence of causally related writes is seen by readers in the same order they were written.
- slug: multi-leader-replication
  term:
    ja: マルチリーダーレプリケーション
    en: multi-leader replication
  definition:
    ja: 複数の拠点・ノードそれぞれがリーダーとして書き込みを受け付け、互いに変更を伝搬し合うレプリケーション構成。
    en: A replication setup where multiple nodes each act as a leader accepting writes, propagating changes to one another.
- slug: write-conflict
  term:
    ja: 書き込みコンフリクト
    en: write conflict
  definition:
    ja: 異なるリーダーが同じデータへほぼ同時に別々の書き込みを受け付けてしまい、伝搬後に矛盾が発覚する状態のこと。
    en: A situation where different leaders accept conflicting writes to the same data at roughly the same time, with the contradiction surfacing only after propagation.
- slug: lww
  term:
    ja: "Last-Write-Wins(LWW)"
    en: "Last-write-wins (LWW)"
  definition:
    ja: "複数リーダー・リーダーレスなレプリケーションで競合する書き込みを解決する戦略の1つ。各書き込みにタイムスタンプを付け、最も新しいものだけを機械的に採用する。実装は単純だが、負けた側の書き込みは黙って破棄されるため、クロックのずれがある環境では「新しい」の判定自体が不正確になりうる。"
    en: "A strategy for resolving conflicting writes in multi-leader or leaderless replication that attaches a timestamp to each write and mechanically keeps only the newest one. Simple to implement, but the losing write is silently discarded, and clock skew across machines can make the notion of \"newest\" unreliable."

- slug: leaderless-replication
  term:
    ja: リーダーレスレプリケーション
    en: leaderless replication
  definition:
    ja: 特定のリーダーを置かず、クライアントが複数のレプリカへ直接並行に読み書きするレプリケーション構成。
    en: A replication setup with no designated leader, where clients read from and write to multiple replicas directly and in parallel.
- slug: quorum-consistency
  term:
    ja: クォーラム
    en: quorum
  definition:
    ja: レプリカ総数N・書き込み確認数W・読み取り問い合わせ数Rについて、W + R > N を満たすことで、書き込み集合と読み取り集合が必ず1台以上重なることを保証する考え方。
    en: A scheme where, given N total replicas, a write quorum W, and a read quorum R satisfying W + R > N, the set of replicas written to and the set read from are guaranteed to overlap by at least one node.

- slug: transaction
  term:
    ja: トランザクション
    en: transaction
  definition:
    ja: アプリケーションが行う複数の読み書きを1つの単位としてまとめ、途中経過を隠したままデータベースに実行させる仕組み。
    en: A mechanism that lets an application group several reads and writes into a single unit, hiding any intermediate state from the outside.

- slug: acid
  term:
    ja: ACID
    en: ACID
  definition:
    ja: トランザクションが満たすべき4つの性質(原子性・一貫性・分離性・永続性)の頭文字をまとめた呼び方。実装によってどこまで厳密に満たすかは幅がある。
    en: An acronym for the four properties a transaction is expected to provide (atomicity, consistency, isolation, durability). How strictly each is provided varies by implementation.

- slug: isolation-level
  term:
    ja: 分離レベル
    en: isolation level
  definition:
    ja: 複数のトランザクションを同時に実行したときに、どの種類の異常(ダーティリードやスキューなど)を防ぐかの強さを表す段階。強いほど異常は減るが同時実行の自由度は下がる。
    en: A setting that determines how strongly a database prevents anomalies (such as dirty reads or skew) when transactions run concurrently. Stronger levels prevent more anomalies at the cost of concurrency.

- slug: dirty-read
  term:
    ja: ダーティリード
    en: dirty read
  definition:
    ja: あるトランザクションがまだコミットしていない書き込みを、別のトランザクションが読み取ってしまう異常。
    en: An anomaly where a transaction reads a write made by another transaction that has not committed yet.

- slug: dirty-write
  term:
    ja: ダーティライト
    en: dirty write
  definition:
    ja: 2つのトランザクションが同じデータへ同時に書き込み、片方のコミット前の書き込みがもう片方に上書きされて失われてしまう異常。
    en: An anomaly where two transactions write to the same data concurrently and one transaction's uncommitted write is overwritten and lost.

- slug: read-skew
  term:
    ja: 読み取りスキュー
    en: read skew
  definition:
    ja: 1つのトランザクションが複数の値を読む間に別のトランザクションがその一部だけを更新・コミットしてしまい、矛盾した組み合わせの値が観測される異常。
    en: An anomaly where, while one transaction reads multiple values, another transaction commits an update to only some of them, causing an inconsistent combination to be observed.

- slug: write-skew
  term:
    ja: 書き込みスキュー
    en: write skew
  definition:
    ja: 複数のトランザクションがそれぞれ関連する値を読み取り、その内容に基づいて別々のオブジェクトへ書き込んだ結果、個々の書き込みは問題なくてもアプリケーションの不変条件を破ってしまう異常。
    en: An anomaly where multiple transactions each read related data and write to different objects based on it, so that each write looks fine alone but the combination violates an application invariant.

- slug: serializability
  term:
    ja: 直列化可能性
    en: serializability
  definition:
    ja: 複数のトランザクションを同時に実行した結果が、それらを何らかの順番で1つずつ実行した場合と同じになるという性質。
    en: The property that the result of running multiple transactions concurrently matches the result of running them one at a time in some order.

- slug: two-phase-locking
  term:
    ja: 2相ロック
    en: two-phase locking
  definition:
    ja: トランザクションがデータを読み書きする前にロックを取得し、コミットまで保持してから一括で解放する悲観的な直列化可能性の実現方式。ロックを解放した後は新たなロックを獲得しない。
    en: A pessimistic approach to serializability where a transaction acquires locks before accessing data, holds them until commit, and releases them all together; no new lock may be acquired after releasing has begun.

- slug: snapshot-isolation
  term:
    ja: スナップショット分離
    en: snapshot isolation
  definition:
    ja: トランザクション開始時点のデータベース全体の一貫したスナップショットを見せる分離レベル。読み取りスキューを防ぐが、書き込みスキューまでは防がない。
    en: An isolation level that gives each transaction a consistent snapshot of the whole database as of when it started. It prevents read skew, but not write skew.

- slug: partitioning
  term:
    ja: パーティショニング
    en: partitioning
  definition:
    ja: 1つの大きなデータセットを複数の独立した区画(パーティション)に分割し、別々のノードに配置する設計手法。1台に載り切らない量のデータやリクエストを、複数台で分担してさばけるようにする。
    en: A design technique that splits one large dataset into independent chunks (partitions) placed on separate nodes, so data volume and request load that would not fit on a single machine can be shared across many.
- slug: key-range-partitioning
  term:
    ja: キーレンジ分割
    en: key-range partitioning
  definition:
    ja: キーの取りうる値を連続した範囲に区切り、各範囲を1つのパーティションに割り当てる分割方式。範囲スキャン(「AからBまでのキーを順に読む」)が得意な一方、範囲の境界をどこに置くかを運用側で継続的に調整する必要がある。
    en: A partitioning scheme that divides the key space into contiguous ranges and assigns each range to a partition. It is efficient for range scans (reading keys from A to B in order), but the range boundaries need ongoing operational tuning.
- slug: hash-partitioning
  term:
    ja: ハッシュ分割
    en: hash partitioning
  definition:
    ja: キーをハッシュ関数に通した出力値をもとにパーティションを決める分割方式。似た値のキーが同じ範囲に固まらないため負荷が均されやすいが、範囲スキャンでは複数パーティションへの問い合わせが必要になりやすい。
    en: A partitioning scheme that assigns a partition based on the output of a hash function applied to the key. Similar keys no longer cluster together, which tends to spread load evenly, but range scans typically need to query multiple partitions.
- slug: consistent-hashing
  term:
    ja: コンシステントハッシュ
    en: consistent hashing
  definition:
    ja: ノードとキーの両方を同じハッシュ空間(リング)上に配置し、キーをリング上で最も近いノードに割り当てる方式。ノード数の増減時に再配置されるキーの範囲を、単純なハッシュ値のmod演算による分割よりも小さく抑えられる。
    en: A scheme that maps both nodes and keys onto the same hash space (a ring) and assigns each key to the nearest node on the ring. It keeps the range of keys that get reassigned when nodes are added or removed much smaller than a plain modulo-based hash split.
- slug: virtual-node
  term:
    ja: 仮想ノード
    en: virtual node
  definition:
    ja: コンシステントハッシュのリング上で、1つの物理ノードを複数の点(仮想ノード、vnode)として配置する仕組み。物理ノードあたりの点数を増やすほどキーの割り当てが均等になりやすく、ノード追加・削除時の負荷差も小さくなる。
    en: A mechanism in consistent hashing where a single physical node is represented by multiple points (virtual nodes, or vnodes) on the ring. Increasing the number of points per physical node tends to make key assignment more even and shrinks the load imbalance caused by adding or removing nodes.
- slug: hotspot
  term:
    ja: ホットスポット
    en: hotspot
  definition:
    ja: 特定のキーやパーティションにアクセスが偏り、そのノードだけ負荷が突出する状態。分割方式を変えても、著名人アカウントのような単一キーへの集中アクセスは解消できない場合がある。
    en: A state where access concentrates on a specific key or partition, causing load on that one node to spike far above the others. Changing the partitioning scheme alone cannot always fix this — concentrated access to a single key, such as a celebrity account, can remain a hotspot regardless.
- slug: rebalancing
  term:
    ja: リバランス
    en: rebalancing
  definition:
    ja: ノードの追加・削除やデータ量の偏りに応じて、パーティションの担当ノードを移動し直す運用作業。自動化するとオペレーターの手間は減るが、意図しないタイミングで大量のデータ移動が走り性能に影響するリスクがある。
    en: The operational process of moving partition ownership between nodes in response to nodes being added or removed, or to uneven data growth. Automating it reduces operator effort, but risks triggering large, unplanned data transfers that hurt performance at an inconvenient time.
- slug: append-only-log
  term:
    ja: 追記型ログ
    en: append-only log
  definition:
    ja: 既存の内容を書き換えず、新しいレコードを常にファイル末尾へ追加していく形式のデータ構造。ディスクへの書き込みが常に連続領域へのシーケンシャル書き込みになるため、ランダムな位置を書き換える方式より高速になりやすい。
    en: A data structure that never rewrites existing content and instead always appends new records to the end of a file. Because every write lands in a contiguous region on disk, it tends to be faster than schemes that overwrite data at random positions.
- slug: hash-index
  term:
    ja: ハッシュインデックス
    en: hash index
  definition:
    ja: キーをハッシュテーブル(メモリ上の連想配列)で管理し、値の格納位置(ログ上のバイトオフセットなど)を直接指し示すインデックス方式。ルックアップはO(1)に近い速度になるが、インデックス全体がメモリに収まる必要があり、キーの大小関係を使った範囲検索は苦手とする。
    en: An indexing scheme that keeps keys in an in-memory hash table pointing directly at where the value is stored, such as a byte offset in a log. Lookups run in close to O(1) time, but the whole index must fit in memory, and it cannot efficiently answer range queries that rely on key ordering.
- slug: write-ahead-log
  term:
    ja: Write-Ahead Log(WAL)
    en: write-ahead log (WAL)
  definition:
    ja: メモリ上のデータ構造に変更を適用する前に、その変更内容を追記型ログとしてディスクへ先に書き出しておく仕組み。クラッシュ後の再起動時にログを先頭から再生することで、メモリ上でまだ永続化されていなかった変更を復元できる。
    en: A mechanism that writes a description of a change to an append-only log on disk before applying it to an in-memory structure. After a crash, replaying the log from the start reconstructs whatever changes had not yet been persisted from memory.
- slug: memtable
  term:
    ja: メモリテーブル(memtable)
    en: memtable
  definition:
    ja: LSM-Treeにおいて、直近の書き込みをキー順に保持するメモリ上のソート済みデータ構造。一定サイズに達するとディスク上のSSTableとして書き出され(フラッシュ)、メモリテーブル自体は空にリセットされる。
    en: In an LSM-tree, the in-memory sorted structure that holds the most recent writes in key order. Once it reaches a size threshold it is written out to disk as an SSTable (a flush), and the memtable itself is reset to empty.
- slug: sstable
  term:
    ja: SSTable
    en: SSTable
  definition:
    ja: Sorted String Tableの略で、キー順にソートされた状態でディスクに書き出されるイミュータブルなセグメントファイル。ソート済みであることを利用して、複数ファイルをマージソートの要領で効率よく統合したり、疎なインデックスだけをメモリに置いて目的のキー付近まで素早く辿り着いたりできる。
    en: Short for Sorted String Table — an immutable segment file written to disk with entries sorted by key. Because the entries are sorted, multiple SSTables can be merged efficiently like a merge sort, and only a sparse in-memory index is needed to jump close to a target key before scanning.
- slug: lsm-tree
  term:
    ja: LSM-Tree
    en: LSM-tree
  definition:
    ja: Log-Structured Merge-Treeの略で、書き込みをまずメモリテーブルとWALに記録し、メモリテーブルが一定量たまるとソート済みのSSTableとしてディスクへフラッシュし、バックグラウンドで複数のSSTableを段階的にマージ・圧縮していくストレージエンジンの設計。書き込みをシーケンシャルなI/Oにまとめやすく、高い書き込みスループットが得意とされる。
    en: Short for Log-Structured Merge-tree — a storage engine design that records writes to an in-memory memtable and a WAL, flushes the memtable to disk as a sorted SSTable once it fills up, and periodically merges and compacts SSTables in the background. Because it batches writes into sequential I/O, it is well suited to high write throughput.
- slug: compaction
  term:
    ja: コンパクション
    en: compaction
  definition:
    ja: 複数のSSTableをキー順にマージしながら1つ(または少数)の新しいSSTableへ統合するバックグラウンド処理。同一キーが複数のSSTableに存在する場合は最新の値だけを残し、トゥームストーンが最深レベルまで到達した場合はそのエントリ自体を取り除くことで、ディスク使用量とルックアップ時に読むファイル数を減らす。
    en: A background process that merges several SSTables in key order into one (or a few) new SSTables. When the same key appears in multiple SSTables, only the newest value is kept, and tombstones that have reached the deepest level are dropped entirely — reducing both disk usage and the number of files a lookup has to check.
- slug: tombstone
  term:
    ja: トゥームストーン
    en: tombstone
  definition:
    ja: 追記型のストレージでキーの削除を表現するための特別な値(削除マーカー)。実際のレコードをその場から消すことができないため、「このキーは削除された」という事実そのものを新しいエントリとして追記し、後続の読み取りやコンパクションがそれを見て元の値を無視する。
    en: A special marker value used to represent a key's deletion in append-only storage. Since an existing record cannot be removed in place, the fact that a key was deleted is itself appended as a new entry, and later reads or compactions see it and ignore the older value underneath.
- slug: bloom-filter
  term:
    ja: ブルームフィルタ
    en: bloom filter
  definition:
    ja: 「あるキーが集合に含まれていない」ことを高速かつ省メモリに判定できる確率的データ構造。存在しないという判定は確実に正しいが、「含まれている」という判定にはまれに偽陽性がありうる。LSM-Treeでは各SSTableに対応するブルームフィルタを持たせ、存在しないキーのために無駄なディスク読み取りをするのを避けるために使う。
    en: A probabilistic data structure that can quickly and compactly tell whether a key is definitely absent from a set. A "definitely absent" answer is always correct, but a "possibly present" answer can occasionally be a false positive. LSM-trees keep one bloom filter per SSTable to skip unnecessary disk reads for keys that are not actually present.
- slug: b-tree-index
  term:
    ja: B-Treeインデックス
    en: B-tree index
  definition:
    ja: 固定サイズのページを単位として、根から葉へ向かうツリー構造でキーを管理するインデックス方式。各ページが多数の子ページを指せる(分岐係数が大きい)ため、データ量が増えてもツリーの深さは緩やかにしか増えない。更新時は該当ページの内容をその場で書き換える。
    en: An indexing scheme that organizes keys in a tree of fixed-size pages from root to leaves. Because each page can point to many children (a high branching factor), the tree's depth grows only slowly as data volume increases. Updates rewrite the relevant page's contents in place.
- slug: column-oriented-storage
  term:
    ja: 列指向ストレージ
    en: column-oriented storage
  definition:
    ja: レコードを行単位ではなく列単位でまとめてディスクに配置するストレージ方式。特定の列だけを読めばよい集計クエリでは読み込むデータ量を大幅に減らせ、同じ列内では値の種類が偏りやすいため圧縮効率も高くなりやすい。一方、1レコード全体の更新は複数の列ファイルにまたがる書き込みになりやすい。
    en: A storage layout that groups data by column across all records, rather than by row. Aggregate queries that only need a few columns can skip reading the rest, and values within a single column tend to compress well because they repeat more. Updating an entire record, however, tends to touch many separate column files.
- slug: row-oriented-storage
  term:
    ja: 行指向ストレージ
    en: row-oriented storage
  definition:
    ja: 1レコードを構成する全カラムの値を連続した領域にまとめて配置するストレージ方式。1件のレコードを丸ごと読み書きする用途(OLTP的な点検索・更新)には都合がよいが、特定の列だけを大量の行にわたって集計するような用途では、不要な列まで一緒に読み込んでしまいやすい。
    en: A storage layout that keeps all the column values belonging to a single record together in a contiguous region. This suits workloads that read or write one whole record at a time (point lookups and updates typical of OLTP), but workloads that aggregate a few columns across many rows end up reading unrelated columns along the way.

- slug: relational-model
  term:
    ja: リレーショナルモデル
    en: relational model
  definition:
    ja: データを行(タプル)の集合であるテーブルとして表現し、テーブル間の関係を外部キーで結びつけるデータモデル。複数テーブルにまたがるデータを取得するにはJOINによる結合が必要になる。
    en: A data model that represents data as tables of rows (tuples), linking tables together via foreign keys. Retrieving data that spans multiple tables typically requires a join.

- slug: document-model
  term:
    ja: ドキュメントモデル
    en: document model
  definition:
    ja: 関連するデータを1つの自己完結した構造化ドキュメント(JSON等)にまとめて格納するデータモデル。ネストしたオブジェクトや配列をそのまま1件のレコードとして表現できる。
    en: A data model that stores related data together in a single self-contained structured document (such as JSON), allowing nested objects and arrays to be represented directly as one record.

- slug: impedance-mismatch
  term:
    ja: インピーダンスミスマッチ
    en: impedance mismatch
  definition:
    ja: アプリケーションコード側の木構造に近いオブジェクト表現と、永続化層のフラットなテーブル形式表現との間にある構造上のズレ、およびそれを埋めるための変換作業の手間。
    en: The structural gap between an application's tree-like object representation and the flat table representation of a persistence layer, along with the conversion effort needed to bridge it.

- slug: schema-on-write
  term:
    ja: スキーマオンライト
    en: schema-on-write
  definition:
    ja: データを書き込む時点でスキーマ(列や型)を確定させ、以降の書き込みがそのスキーマに従うことを要求する運用方式。
    en: An approach where the schema (columns and types) is fixed at write time, and subsequent writes are required to conform to it.

- slug: schema-on-read
  term:
    ja: スキーマオンリード
    en: schema-on-read
  definition:
    ja: 書き込み時にスキーマを固定せず、読み取り側がそのつどデータの構造を解釈する運用方式。異なる形のデータが同じ格納先に混在しうる。
    en: An approach where the schema is not fixed at write time, and the reading code interprets the structure of the data as needed. Records of differing shapes can coexist in the same store.

- slug: locality
  term:
    ja: ローカリティ
    en: locality
  definition:
    ja: 関連するデータを物理的に近い場所(連続した領域)にまとめて格納する性質。関連データをまとめて読み書きするアクセスパターンでは往復回数を減らせるが、部分読み取りや部分更新では無駄が生じやすい。
    en: The property of storing related data close together in a contiguous region. It reduces round trips for access patterns that read or write related data together, but can waste effort on partial reads or partial updates.

- slug: normalization
  term:
    ja: 正規化
    en: normalization
  definition:
    ja: 重複するデータを別テーブルへ切り出し、参照(外部キーなどの識別子)で結びつけることで、同じ情報を複数箇所に重複して持たないようにする設計手法。
    en: A design technique that extracts duplicated data into separate tables and links them via references (such as foreign keys), so the same information is not stored redundantly in multiple places.

- slug: denormalization
  term:
    ja: 非正規化
    en: denormalization
  definition:
    ja: 参照先のデータをコピーして同じレコード内に埋め込み、読み取り時の結合を減らす設計手法。読み取りは単純になる一方、更新時にコピーした全箇所を一貫して直す責任を引き受ける。
    en: A design technique that copies referenced data and embeds it in the same record to reduce joins at read time. Reads become simpler, but every copy must be kept consistent on update.

- slug: many-to-many-relationship
  term:
    ja: 多対多関係
    en: many-to-many relationship
  definition:
    ja: 一方の集合の1件が他方の集合の複数件と結びつき、かつその逆方向も複数件と結びつきうる関係。中間テーブル(連関テーブル)や同等の参照構造で表現することが多い。
    en: A relationship in which one record in a set can be linked to multiple records in another set, and vice versa. It is typically represented with a join table or an equivalent reference structure.

- slug: graph-data-model
  term:
    ja: グラフデータモデル
    en: graph data model
  definition:
    ja: データを頂点(ノード)と、頂点間を結ぶ辺(エッジ)の集合として表現するデータモデル。要素間の関係そのものが一級のデータとして扱われる点が特徴。
    en: A data model that represents data as a set of vertices (nodes) and edges connecting them. The relationships between elements are treated as first-class data in their own right.

- slug: property-graph
  term:
    ja: プロパティグラフ
    en: property graph
  definition:
    ja: 頂点と辺のそれぞれが任意のキーと値の組(プロパティ)を持てるグラフデータモデルの一形態。頂点にはラベル、辺には向きとタイプを持たせられることが多い。
    en: A form of graph data model in which both vertices and edges can carry arbitrary key-value properties. Vertices are often given labels, and edges a direction and a type.

- slug: reliability
  term:
    ja: 信頼性
    en: reliability
  definition:
    ja: システムが期待どおりに正しく動作し続け、障害が起きても致命的な影響を最小限に抑えられる性質。
    en: The quality of a system continuing to behave correctly as expected, and containing the impact of faults so they do not become catastrophic.

- slug: fault
  term:
    ja: フォールト
    en: fault
  definition:
    ja: システムを構成する一部のコンポーネントが仕様どおりに動作しなくなること。フォールト自体は個別の構成要素の異常であり、システム全体が利用者への提供を止める「障害」とは区別して扱う。
    en: A single component of a system deviating from its specification. A fault is distinct from an overall system failure — the goal of fault-tolerant design is to prevent individual faults from turning into a failure that affects users.

- slug: fault-tolerance
  term:
    ja: フォールトトレランス
    en: fault tolerance
  definition:
    ja: 一部のコンポーネントにフォールトが発生しても、システム全体としては利用者へのサービス提供を継続できるように設計する考え方。冗長化・分離・監視などを組み合わせて実現する。
    en: A design approach that keeps a system serving users even when some of its components experience faults, typically achieved through a combination of redundancy, isolation, and monitoring.

- slug: cascading-failure
  term:
    ja: 連鎖障害
    en: cascading failure
  definition:
    ja: 1つのコンポーネントの遅延・停止が、リトライの増加や依存先の過負荷を通じて別のコンポーネントにも波及し、局所的な不調がシステム全体の障害へと連鎖的に拡大していく現象。
    en: A phenomenon in which the slowdown or outage of one component spreads to others — through increased retries or overloaded dependencies — turning a localized problem into a system-wide failure.

- slug: load-parameter
  term:
    ja: 負荷パラメータ
    en: load parameter
  definition:
    ja: システムにかかる負荷の大きさを表すために選ぶ指標。リクエスト数/秒、同時接続数、読み書き比率など、システムのアーキテクチャに応じて意味のある指標を選定する必要がある。
    en: A metric chosen to describe the load placed on a system, such as requests per second, concurrent connections, or the ratio of reads to writes. Which parameters are meaningful depends on the system's architecture.

- slug: throughput
  term:
    ja: スループット
    en: throughput
  definition:
    ja: 単位時間あたりに処理できるリクエストやレコードの件数。処理能力そのものを表す指標で、個々のリクエストがどれだけ速く完了するかを表す応答時間とは別の観点。
    en: The number of requests or records a system can process per unit of time. It measures processing capacity, which is a different concern from how quickly any single request completes.

- slug: response-time
  term:
    ja: 応答時間
    en: response time
  definition:
    ja: クライアントがリクエストを送信してから応答を受け取るまでにかかる時間。ネットワーク遅延やキューでの待ち時間も含む、利用者が体感する時間そのもの。
    en: The time a client experiences from sending a request to receiving a response, including network delay and any time spent waiting in a queue — the time users actually perceive.

- slug: latency
  term:
    ja: レイテンシ
    en: latency
  definition:
    ja: リクエストが処理を待っている(まだ処理されていない)時間。応答時間の内訳の1つとして使われることが多いが、文脈によっては応答時間とほぼ同義に使われることもある。
    en: The time a request spends waiting to be handled. It is often discussed as one component of response time, though in casual usage the two terms are sometimes used interchangeably.

- slug: percentile
  term:
    ja: パーセンタイル
    en: percentile
  definition:
    ja: 測定値を昇順に並べたときに、指定した割合の値がそれ以下に収まる境界値。p95なら「全体の95%のリクエストがその値以下で完了した」ことを表す。
    en: The boundary value below which a given proportion of sorted measurements fall. The p95, for example, is the value at or under which 95% of requests completed.

- slug: tail-latency-amplification
  term:
    ja: テールレイテンシの増幅
    en: tail latency amplification
  definition:
    ja: 1件のリクエストが複数のバックエンド呼び出しを並列に発行する構成(ファンアウト)で、全体の応答時間が並列呼び出しのうち最も遅いものに支配されるため、並列呼び出しの数が増えるほど遅い外れ値に遭遇する確率が高まり、利用者が体感する遅延が個々の呼び出し単体のパーセンタイルより悪化する現象。
    en: In systems where a single request fans out to multiple parallel backend calls, overall response time is dominated by the slowest of those calls. As the number of parallel calls grows, the chance of hitting a slow outlier rises, so the latency users actually experience is worse than any individual call's percentile would suggest.

- slug: operability
  term:
    ja: 運用性
    en: operability
  definition:
    ja: 日々の運用作業(監視・障害対応・設定変更など)をしやすくするシステムの性質。予測可能な挙動、十分な可観測性、自動化しやすい手順が運用性を高める。
    en: The quality of a system that makes day-to-day operations — monitoring, incident response, configuration changes — easier to carry out. Predictable behavior, good observability, and automatable procedures all contribute to it.

- slug: simplicity
  term:
    ja: 単純性
    en: simplicity
  definition:
    ja: システムの複雑さのうち、問題領域そのものに起因しない「偶発的複雑性」を減らし、コードやアーキテクチャを見通しやすく保つ性質。適切な抽象化によって実現される。
    en: The quality of keeping a system's code and architecture easy to understand by reducing "accidental complexity" — complexity that comes from the implementation rather than from the problem itself. Good abstractions are the main tool for achieving it.

- slug: evolvability
  term:
    ja: 発展性
    en: evolvability
  definition:
    ja: 将来の要件変化に応じてシステムを安全かつ低コストで変更し続けられる性質。疎結合なモジュール構成やテストの充実度が、変更のしやすさを左右する。
    en: The quality of being able to keep changing a system safely and cheaply as requirements evolve. Loosely coupled modules and solid test coverage are the main levers that make change easier.

- slug: encoding
  term:
    ja: エンコーディング(シリアライズ)
    en: encoding (serialization)
  definition:
    ja: 実行中のメモリ上のデータ構造を、保存や送信のためのバイト列へ変換すること。受け取った側がバイト列を元のデータ構造へ戻す処理はデコーディング(パース)と呼ぶ。
    en: Converting an in-memory data structure into a sequence of bytes for storage or transmission. The reverse process, turning bytes back into a data structure, is called decoding (parsing).
- slug: textual-format
  term:
    ja: テキスト形式
    en: textual format
  definition:
    ja: JSON・XML・CSVのように、値を人間が読める文字の並びとして表現するエンコーディング形式。目視での確認がしやすい一方、同じ情報量でもバイナリ形式よりサイズが大きくなりがちである。
    en: An encoding format such as JSON, XML, or CSV that represents values as human-readable characters. Easy to inspect visually, but tends to be larger than binary formats for the same amount of information.
- slug: binary-format
  term:
    ja: バイナリ形式
    en: binary format
  definition:
    ja: 値を人間可読な文字列ではなく直接バイト列として表現するエンコーディング形式。フィールド名を毎回書き出さない分コンパクトになりやすいが、専用のツールなしでは中身を確認しづらい。
    en: An encoding format that represents values directly as bytes rather than human-readable text. Tends to be more compact since field names need not be written out each time, but is hard to inspect without dedicated tooling.
- slug: schema-based-encoding
  term:
    ja: スキーマベースエンコーディング
    en: schema-based encoding
  definition:
    ja: エンコード側とデコード側が共通のスキーマ定義を参照することで、フィールド名の文字列をバイト列に含めずにデータの構造を復元できるエンコーディング方式。
    en: An encoding approach where both the encoder and decoder refer to a shared schema definition, so the structure of the data can be reconstructed without embedding field name strings in the byte stream.
- slug: field-tag
  term:
    ja: フィールドタグ
    en: field tag
  definition:
    ja: スキーマベースのエンコーディングで各フィールドに割り当てられる小さな整数の識別子。フィールドの位置ではなくタグ番号でデータを識別するため、スキーマへのフィールド追加や不使用化があっても新旧のデータを区別して解釈しやすくなる。
    en: A small integer identifier assigned to each field in a schema-based encoding. Because data is identified by tag number rather than position, old and new data can still be told apart correctly even after fields are added to or retired from the schema.
- slug: schema-evolution
  term:
    ja: スキーマ進化
    en: schema evolution
  definition:
    ja: 運用中にデータのスキーマを変更しても、新旧のコードが引き続き互いのデータを読み書きできるようにする設計上の取り組み。
    en: The practice of changing a data schema over time in a way that lets old and new code continue to read and write each other's data.
- slug: backward-compatibility
  term:
    ja: 後方互換性
    en: backward compatibility
  definition:
    ja: 新しいバージョンのコードが、古いバージョンのコードが書いたデータを正しく読める性質のこと。
    en: The property that newer code can correctly read data written by older code.
- slug: forward-compatibility
  term:
    ja: 前方互換性
    en: forward compatibility
  definition:
    ja: 古いバージョンのコードが、新しいバージョンのコードが書いたデータを(壊れずに)読める性質のこと。
    en: The property that older code can read data written by newer code without breaking.
- slug: rpc
  term:
    ja: RPC(リモートプロシージャコール)
    en: RPC (remote procedure call)
  definition:
    ja: ネットワーク越しの別プロセスに対して、あたかもローカルの関数呼び出しであるかのような見た目でリクエストを送る仕組み。呼び出し側と呼び出される側が別々にデプロイされるため、双方向の互換性が求められやすい。
    en: A mechanism for making a request to a process across the network with the same call syntax as a local function call. Because caller and callee are typically deployed independently, both directions of compatibility tend to matter.
- slug: message-queue
  term:
    ja: メッセージキュー
    en: message queue
  definition:
    ja: 送信者がメッセージを直接相手プロセスへ送るのではなく仲介役のキューに投入し、受信者がそこから取り出して処理する仕組み。送信者と受信者が同時にオンラインである必要がない。
    en: A mechanism where a sender places a message into an intermediary queue rather than sending it directly to a recipient process, and a receiver later pulls it out for processing. Sender and receiver need not be online at the same time.
- slug: rest-api
  term:
    ja: REST API
    en: REST API
  definition:
    ja: HTTPのメソッドやURLを使ってリソースへの操作を表現する、RPCの一種として広く使われるAPIスタイル。
    en: A widely used API style, a form of RPC, that expresses operations on resources using HTTP methods and URLs.
- slug: unbundling
  term:
    ja: アンバンドリング
    en: unbundling
  definition:
    ja: 単一のデータベース製品が担っていた役割を、用途ごとに特化した複数の専用データシステムに分解し、それらを組み合わせて全体のシステムを構成する設計の考え方。
    en: The design idea of decomposing the roles a single database product used to play into multiple specialized data systems, each suited to a particular use case, and composing them into the overall system.
- slug: derived-data
  term:
    ja: 派生データ
    en: derived data
  definition:
    ja: システム内で正とみなされる一次情報から、決まった変換処理によって生成される別の表現のデータ。検索インデックスや集計結果、キャッシュなどが該当する。
    en: Data produced from a system's authoritative source of truth by applying a defined transformation, such as a search index, an aggregated summary, or a cache.
- slug: end-to-end-argument
  term:
    ja: エンドツーエンド原則
    en: end-to-end argument
  definition:
    ja: あるアプリケーション要件(正しさの保証など)は下位のネットワークやミドルウェア層に完全には肩代わりさせられず、最終的には通信の両端(アプリケーション自身)が責任を持って保証する必要がある、という設計上の考え方。
    en: The design principle that an application-level requirement, such as a correctness guarantee, cannot be fully delegated to lower network or middleware layers and must ultimately be enforced by the communicating endpoints (the application itself).
- slug: idempotency
  term:
    ja: 冪等性
    en: idempotency
  definition:
    ja: ある操作を同じ入力で複数回実行しても、1回実行した場合と同じ結果になる性質。重複実行や再送があっても最終的な効果が変わらないようにする設計で利用される。
    en: The property that performing an operation multiple times with the same input produces the same result as performing it once, used to make an operation's effect unchanged by duplicate execution or retries.
- slug: event-sourcing
  term:
    ja: イベントソーシング
    en: event sourcing
  definition:
    ja: 状態そのものを上書き保存するのではなく、「何が起きたか」を表すイベントを追記専用ログとして記録し、現在の状態はそのイベント列を順に適用して導出するデータ保持のスタイル。
    en: A style of data storage in which state is not overwritten directly; instead, events describing what happened are recorded to an append-only log, and current state is derived by applying that sequence of events in order.
- slug: auditability
  term:
    ja: 監査可能性
    en: auditability
  definition:
    ja: システムの現在の状態や派生データがどのように導出されたかを、後から履歴をたどって検証・再現できる性質。ログからの状態再構築と、元の状態との突き合わせまでを含む。
    en: The property that a system's current state or derived data can be traced back and verified or reproduced after the fact, encompassing both reconstructing state from a log and comparing it against the original state.
- slug: batch-processing
  term:
    ja: バッチ処理
    en: batch processing
  definition:
    ja: 蓄積された有限のデータ集合をまとめて読み込み、集計・変換した結果を後で使えるように書き出す処理形態。個々の処理への即時応答は求められない代わりに、大規模な入力を扱えるスループットが重視される。
    en: A processing style that reads in a finite, already-accumulated set of data, transforms or aggregates it, and writes out results for later use. Individual operations need not respond instantly, but the system must handle high-throughput, large-scale input.
- slug: mapreduce
  term:
    ja: MapReduce
    en: MapReduce
  definition:
    ja: 分散バッチ処理を「map」「シャッフル」「reduce」の3段階に定式化するプログラミングモデル。各レコードを独立に変換するmapと、キーごとに値を集約するreduceに役割を分けることで、大規模な並列実行と障害からの再実行を扱いやすくする。
    en: A programming model that formulates distributed batch processing as three stages — map, shuffle, and reduce. Splitting the work into an independent per-record transformation (map) and a per-key aggregation (reduce) makes large-scale parallel execution and recovery from failed tasks easier to manage.
- slug: shuffle-phase
  term:
    ja: シャッフルフェーズ
    en: shuffle phase
  definition:
    ja: MapReduceにおいて、map段階が出力したキー・値ペアを、同じキーの値同士が同じreduceタスクに集まるようクラスタ全体でネットワーク越しに再配置する段階。
    en: The stage in MapReduce that redistributes the key-value pairs emitted by the map stage across the cluster's network so that all values sharing a key arrive at the same reduce task.
- slug: reduce-side-join
  term:
    ja: リデュース側結合
    en: reduce-side join
  definition:
    ja: 結合対象の複数の入力からキーを揃えたペアを出力し、シャッフル段階で同じキーの値を1つのreduceタスクへ集約したうえで結合結果を組み立てる戦略。入力サイズに関わらず動作するが、全データがシャッフルを経由するため通信コストが大きくなりやすい。
    en: A join strategy in which multiple inputs emit pairs keyed by the join key, the shuffle stage gathers same-key values into a single reduce task, and the reduce task assembles the joined output. It works regardless of input size, but routing all data through the shuffle tends to be costly in network traffic.
- slug: sort-merge-join
  term:
    ja: ソートマージ結合
    en: sort-merge join
  definition:
    ja: 結合対象の入力をあらかじめ結合キーでソートしておき、ソート済みの2つのストリームを先頭から一度だけ突き合わせて結合する手法。MapReduceのシャッフル段階がキー順でデータを届ける性質を利用している。
    en: A join technique that sorts both inputs by the join key ahead of time, then merges the two sorted streams in a single pass from the start. It relies on the property that MapReduce's shuffle stage delivers data to reducers in key order.
- slug: broadcast-hash-join
  term:
    ja: ブロードキャストハッシュ結合
    en: broadcast hash join
  definition:
    ja: 結合対象の一方が全マシンのメモリに収まるほど小さいとき、その入力を全マシンへ配布してハッシュテーブルとして保持し、大きい方の入力を読みながらその場で結合する戦略。シャッフル段階そのものを省略できる。
    en: "A join strategy usable when one input is small enough to fit in memory on every machine: that input is broadcast to all machines and kept as a hash table, and the larger input is joined against it on the fly as it is read. This avoids the shuffle stage entirely."
- slug: skewed-key
  term:
    ja: スキューしたキー
    en: skewed key
  definition:
    ja: 結合や集計の対象データにおいて、他のキーに比べて著しく多くのレコードが紐づいているキー。シャッフル段階は同じキーの値を1つのタスクへ集約するため、スキューしたキーがあるとそのタスクだけが突出して重くなりジョブ全体のボトルネックになりやすい。
    en: A key that has a disproportionately large number of records associated with it compared to other keys, in a join or aggregation workload. Because the shuffle stage funnels all values for a key into a single task, a skewed key can make that one task a severe bottleneck for the whole job.
- slug: dataflow-engine
  term:
    ja: データフローエンジン
    en: dataflow engine
  definition:
    ja: 計算全体を固定のmap・reduce2段階ではなく、任意個数のオペレータからなる有向非巡回グラフ(DAG)として表現し実行するバッチ処理の仕組み。段階間のデータをディスクへ完全に書き出さずメモリ上でパイプライン的に受け渡せる場合があり、多段階パイプラインを効率化する。
    en: A batch-processing mechanism that expresses an entire computation as a directed acyclic graph (DAG) of arbitrarily many operators rather than a fixed two-stage map/reduce, and executes it accordingly. It can sometimes pipeline data between stages in memory instead of fully materializing it to disk, making multi-stage pipelines more efficient.
- slug: materialization
  term:
    ja: マテリアライズ
    en: materialization
  definition:
    ja: 処理の途中結果を、次の処理段階が読み始める前に永続ストレージへ完全に書き出すこと。耐障害性に寄与する一方、書き込み・読み込みのI/Oコストがかかり、多段階パイプラインの速度を落とす要因になる。
    en: Writing an intermediate processing result completely to persistent storage before the next stage begins reading it. This helps with fault tolerance, but the write/read I/O cost can slow down multi-stage pipelines.
- slug: idempotent-output
  term:
    ja: 冪等な出力
    en: idempotent output
  definition:
    ja: 同じタスクが再実行されたり重複して実行されたりしても、最終的な出力結果が変わらない性質。決定的な計算に加え、出力の書き込み自体をアトミックに行うことで実現される。
    en: The property that a task's final output stays the same even if the task is retried or executed more than once. Achieved through a combination of deterministic computation and writing output atomically.
- slug: stream-processing
  term:
    ja: "ストリーム処理"
    en: "stream processing"
  definition:
    ja: "区切りのない(無限に続きうる)イベント列を、発生するたびに少しずつ読み込み、変換・集計した結果をそのつど反映していく処理形態。大規模な入力をまとめて処理するスループットよりも、個々のイベントに対する低いレイテンシでの反映が重視される。"
    en: "A processing style that reads an unbounded, potentially endless sequence of events a little at a time as they occur, transforming or aggregating them and reflecting the results right away. Compared to batch processing, it emphasizes low per-event latency over throughput on large, already-accumulated input."

- slug: event-stream
  term:
    ja: イベントストリーム
    en: event stream
  definition:
    ja: 「何かが起きた」という事実を表すイベントが、区切りなく発生し続ける連なりとして扱われるデータの流れ。バッチ処理のような有限のまとまりではなく、継続的に到着し続けることを前提とする。
    en: A continuous, unbounded sequence of events, each representing a fact that something happened, treated as an ongoing flow of data rather than a finite batch.
- slug: event-log
  term:
    ja: イベントログ
    en: event log
  definition:
    ja: 新しいイベントが常に末尾に追加され、既存のイベントは変更されない追記専用のデータ構造。順序の保存やコンシューマーの独立した進捗管理、過去イベントの再生を可能にする。
    en: An append-only data structure where new events are always added at the end and existing events are never modified, enabling order preservation, independently tracked consumer progress, and replay of past events.
- slug: consumer-offset
  term:
    ja: コンシューマオフセット
    en: consumer offset
  definition:
    ja: あるコンシューマーがイベントログのどこまで読み終えたかを示す位置。コンシューマーごとに独立して管理されるため、複数のコンシューマーが互いに干渉せず異なるペースで同じログを読み進められる。
    en: A marker indicating how far a given consumer has read through an event log. Because it is tracked independently per consumer, multiple consumers can read the same log at their own pace without interfering with each other.
- slug: change-data-capture
  term:
    ja: チェンジデータキャプチャ(CDC)
    en: change data capture (CDC)
  definition:
    ja: データベースへの書き込みをイベントストリームとして取り出す手法の総称。アプリケーションコードがDBとイベントストリームへ別々に書き込む「二重書き込み」を避け、検索インデックスやキャッシュなどの派生データをDBの変更に追従させるために使われる。
    en: A family of techniques for extracting database writes as an event stream. It avoids the "dual write" problem of application code writing to a database and an event stream separately, and is used to keep derived data such as search indexes or caches in sync with database changes.
- slug: outbox-pattern
  term:
    ja: アウトボックスパターン
    en: outbox pattern
  definition:
    ja: 本来のデータ更新と、送信すべきイベントの記録を同一のデータベーストランザクション内で行い、別プロセスがそのアウトボックステーブルを読み取って外部のイベントストリームへ配信する設計パターン。二重書き込み問題を単一データストア内の原子性の問題に還元する。
    en: A design pattern in which the primary data update and the record of an event to be sent are written in the same database transaction, and a separate process later reads that outbox table and delivers the events to an external stream. It reduces the dual-write problem to a single data store's atomicity guarantee.
- slug: tumbling-window
  term:
    ja: タンブリングウィンドウ
    en: tumbling window
  definition:
    ja: 固定長で互いに重ならない時間区間に分割するウィンドウ方式。あるイベントは、そのイベント時刻が収まる1つのウィンドウにのみ属する。
    en: A windowing scheme that divides time into fixed-length, non-overlapping intervals. Any given event belongs to exactly one window, the one that its event time falls into.
- slug: sliding-window
  term:
    ja: スライディングウィンドウ
    en: sliding window
  definition:
    ja: ウィンドウの幅とは別にステップ幅(ずらす間隔)を持ち、隣接するウィンドウが重なり合うことを許すウィンドウ方式。1つのイベントが複数のウィンドウの計算に同時に含まれ得る。
    en: A windowing scheme with a step size separate from the window length, allowing adjacent windows to overlap. A single event can contribute to more than one window's computation at the same time.
- slug: event-time
  term:
    ja: イベント時刻
    en: event time
  definition:
    ja: あるイベントが実際に発生した時刻。ストリーム処理システムがそのイベントを受け取って処理した時刻(処理時刻)とは、ネットワーク遅延や再送などにより一致するとは限らない。
    en: The time at which an event actually occurred. It is not necessarily the same as the time the stream processing system received and processed the event (processing time), since network delay and retries can separate the two.
- slug: processing-time
  term:
    ja: 処理時刻
    en: processing time
  definition:
    ja: ストリーム処理システムがあるイベントを実際に受け取って処理した時刻。イベント時刻より後になり、そのずれの大きさはイベントごとにばらつく。
    en: The time at which the stream processing system actually received and processed an event. It comes after event time, and the gap between the two varies from event to event.
- slug: watermark
  term:
    ja: ウォーターマーク
    en: watermark
  definition:
    ja: 「これより前のイベント時刻を持つイベントは、もう届かないとみなしてよい」という処理システム側の推測を表す時刻の指標。典型的には、これまでに観測したイベント時刻の最大値から許容遅延を差し引いて計算される。
    en: A time-valued indicator representing the processing system's assumption that "events with an earlier event time can now be considered no longer arriving." It is typically computed as the maximum event time observed so far minus an allowed lateness bound.
- slug: late-arriving-event
  term:
    ja: 遅延到着イベント
    en: late-arriving event
  definition:
    ja: ウォーターマークがそのイベントの属するウィンドウの終了時刻を追い越した後に到着するイベント。破棄する、許容遅延を長く取る、確定後の集計結果を再訂正する、といった対処が考えられる。
    en: An event that arrives after the watermark has already advanced past the end of the window it belongs to. Common responses include dropping it, allowing a longer lateness bound, or issuing a correction to an already-finalized window result.
