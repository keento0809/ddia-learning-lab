slug: 06-partitioning/consistent-hash-ring
language: js
entry: assignKey
template: |
  // Implement a consistent hashing ring with virtual nodes (vnodes).
  //
  // hashToAngle(value) converts a string into an angle in degrees (0-360)
  // and is already implemented for you (do not change it). Use this angle
  // as the position on the ring.
  export function hashToAngle(value) {
    let hash = 2166136261;
    for (let i = 0; i < value.length; i++) {
      hash ^= value.charCodeAt(i);
      hash = Math.imul(hash, 16777619);
    }
    const unsigned = hash >>> 0;
    return (unsigned / 4294967296) * 360;
  }

