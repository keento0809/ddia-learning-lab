slug: "12-capstone-design/audit-log-integrity-lab"
language: js
entry: checkAuditLogIntegrity
template: |
  // events: an array of audit-log events. Each element has the shape
  // { seq: number }.
  // seq is meant to be a 1-based sequence number, but events may arrive
  // out of order, and gaps (missing numbers) or duplicates may occur.
  //
  // Return value: { missing: number[], duplicates: number[] }
  // - missing: numbers that never appeared, within the range from the
  //   minimum to the maximum observed seq, listed in ascending order
  // - duplicates: seq numbers that appeared 2 or more times, listed in
  //   ascending order with no repeats
  export function checkAuditLogIntegrity(events) {
    // TODO: implement
  }
tests:
  - id: t1-no-gaps-no-duplicates
    name:
      ja: "欠落も重複もない連番ログを正しく判定する"
      en: "correctly judges a sequential log with no gaps or duplicates"
    call:
      {
        fn: "checkAuditLogIntegrity",
        args: [[{ seq: 1 }, { seq: 2 }, { seq: 3 }, { seq: 4 }, { seq: 5 }]],
      }
    assert: { type: "deepEquals", value: { missing: [], duplicates: [] } }
  - id: t2-single-gap
    name:
      ja: "1箇所の欠落を検出する"
      en: "detects a single missing sequence number"
    call:
      { fn: "checkAuditLogIntegrity", args: [[{ seq: 1 }, { seq: 2 }, { seq: 4 }, { seq: 5 }]] }
    assert: { type: "deepEquals", value: { missing: [3], duplicates: [] } }
  - id: t3-single-duplicate
    name:
      ja: "1箇所の重複を検出する"
      en: "detects a single duplicated sequence number"
    call:
      { fn: "checkAuditLogIntegrity", args: [[{ seq: 1 }, { seq: 2 }, { seq: 2 }, { seq: 3 }]] }
    assert: { type: "deepEquals", value: { missing: [], duplicates: [2] } }
  - id: t4-unsorted-mixed
    name:
      ja: "順序が入れ替わったログでも欠落と重複の両方を検出する"
      en: "detects both gaps and duplicates even when the log arrives out of order"
    call:
      {
        fn: "checkAuditLogIntegrity",
        args: [[{ seq: 5 }, { seq: 1 }, { seq: 3 }, { seq: 3 }, { seq: 1 }]],
      }
    assert:
      { type: "deepEquals", value: { missing: [2, 4], duplicates: [1, 3] } }
  - id: t5-single-event
    name:
      ja: "イベントが1件だけなら欠落も重複もない"
      en: "reports no gaps or duplicates for a single event"
    call: { fn: "checkAuditLogIntegrity", args: [[{ seq: 7 }]] }
    assert: { type: "deepEquals", value: { missing: [], duplicates: [] } }
timeoutMs: 3000
hints:
  - ja: "各seq値の出現回数を数えるマップ(Map等)をまず作ると、欠落と重複の両方を1回の走査で扱いやすくなります"
    en: "Start by building a count map of how many times each seq value appears; this makes it easy to derive both gaps and duplicates in one pass"
  - ja: "欠落は観測された最小seq〜最大seqの範囲を昇順に走査し、出現回数マップに存在しない番号を集めれば求まります"
    en: "For gaps, walk the range from the minimum to the maximum observed seq and collect the numbers that never appear in the count map"
  - ja: "重複は出現回数マップを見て、値が2以上になっているキーを昇順に並べれば求まります"
    en: "For duplicates, look at the count map for keys whose count is 2 or more and sort them in ascending order"
