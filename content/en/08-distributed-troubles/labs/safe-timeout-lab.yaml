  //
  // Return a safe timeout value (milliseconds) that keeps false positives
  // in check. Since comparing timestamps can be skewed by clock drift in
  // either direction, budget twice the drift bound.
  export function computeSafeTimeoutMs(p99RttMs, maxClockDriftMs, safetyMarginMs) {
