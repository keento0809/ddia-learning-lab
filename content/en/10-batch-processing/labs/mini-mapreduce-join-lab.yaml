  //
  // Join an array of order records { orderId, customerId, item } with
  // an array of customer records { customerId, name }, following the
  // map/shuffle/reduce approach.

  // mapOrders: takes an array of order records and returns an array of
  // [customerId, { type: "order", orderId, item }] pairs, in the same
  // order as the input.
  export function mapOrders(orders) {
    // TODO: implement
  }

  // mapCustomers: takes an array of customer records and returns an
  // array of [customerId, { type: "customer", name }] pairs, in the
  // same order as the input.
  export function mapCustomers(customers) {
    // TODO: implement
  }

  // shuffleJoin: takes mapCustomers' output and mapOrders' output, and
  // groups pairs by customerId, preserving the order in which
  // customerPairs was concatenated before orderPairs.
  // Returns an array of [customerId, array of values] pairs, sorted
  // ascending by customerId.
  export function shuffleJoin(customerPairs, orderPairs) {
    // TODO: implement
  }

  // reduceJoin: takes shuffleJoin's output. For each group where a
  // customer-derived value (name) is found, emits
  // { orderId, item, customerId, customerName } for every order-derived
  // value in that group.
  // Groups with no matching customer emit nothing (orders for a
  // customer ID missing from the master data are excluded from the
