slug: "02-data-models/denormalize-users-lab"
language: js
entry: denormalizeUsers
template: |
  // Take two normalized arrays (users, orders) and return an array of
  // denormalized documents (an array where each user object has the
  // orders belonging to that user embedded in it).
  // - Each element of the return value should have the shape
  //   { id, name, orders: [...] }
  // - Attach the orders whose userId matches the target user's id.
  // - An order whose userId doesn't match any user's id is ignored
  //   (not included in the result).
  // - Each user's orders should keep the order they appeared in within
  //   the input orders array.
  // - A user with no matching orders should get an empty orders array.
  // - The order of elements in the return value should follow the order
  //   of the input users array.
  export function denormalizeUsers(users, orders) {
    // TODO: implement
  }
tests:
  - id: t1
    name:
      ja: "複数userへ注文が正しく振り分けられる"
      en: "Orders are grouped under the correct user"
    call:
      fn: "denormalizeUsers"
      args:
        - - { id: 1, name: "Alice" }
          - { id: 2, name: "Bob" }
        - - { id: 101, userId: 1, item: "Book" }
          - { id: 102, userId: 2, item: "Pen" }
          - { id: 103, userId: 1, item: "Pencil" }
    assert:
      type: deepEquals
      value:
        - id: 1
          name: "Alice"
          orders:
            - { id: 101, userId: 1, item: "Book" }
            - { id: 103, userId: 1, item: "Pencil" }
        - id: 2
          name: "Bob"
          orders:
            - { id: 102, userId: 2, item: "Pen" }
  - id: t2
    name:
      ja: "注文が無いuserのordersは空配列になる"
      en: "A user with no orders gets an empty orders array"
    call:
      fn: "denormalizeUsers"
      args:
        - - { id: 1, name: "Alice" }
          - { id: 2, name: "Bob" }
        - - { id: 101, userId: 1, item: "Book" }
    assert:
      type: deepEquals
      value:
        - id: 1
          name: "Alice"
          orders:
            - { id: 101, userId: 1, item: "Book" }
        - id: 2
          name: "Bob"
          orders: []
  - id: t3
    name:
      ja: "どのuserにも一致しない注文は無視される"
      en: "Orders that match no user are ignored"
    call:
      fn: "denormalizeUsers"
      args:
        - - { id: 1, name: "Alice" }
        - - { id: 101, userId: 1, item: "Book" }
          - { id: 102, userId: 99, item: "Ghost" }
    assert:
      type: deepEquals
      value:
        - id: 1
          name: "Alice"
          orders:
            - { id: 101, userId: 1, item: "Book" }
  - id: t4
    name:
      ja: "複数userの注文が交互に現れても正しくグルーピングされ、出現順が保たれる"
      en: "Interleaved orders across users are grouped correctly and keep their relative order"
    call:
      fn: "denormalizeUsers"
      args:
        - - { id: 1, name: "Alice" }
          - { id: 2, name: "Bob" }
        - - { id: 301, userId: 2, item: "X" }
          - { id: 302, userId: 1, item: "Y" }
          - { id: 303, userId: 2, item: "Z" }
          - { id: 304, userId: 1, item: "W" }
    assert:
      type: deepEquals
      value:
        - id: 1
          name: "Alice"
          orders:
            - { id: 302, userId: 1, item: "Y" }
            - { id: 304, userId: 1, item: "W" }
        - id: 2
          name: "Bob"
          orders:
            - { id: 301, userId: 2, item: "X" }
            - { id: 303, userId: 2, item: "Z" }
  - id: t5
    name:
      ja: "usersが空配列なら結果も空配列"
      en: "An empty users array yields an empty result"
    call:
      fn: "denormalizeUsers"
      args:
        - []
        - - { id: 101, userId: 1, item: "Book" }
    assert: { type: deepEquals, value: [] }
  - id: t6
    name:
      ja: "ordersが空配列ならすべてのuserのordersが空配列になる"
      en: "An empty orders array leaves every user's orders empty"
    call:
      fn: "denormalizeUsers"
      args:
        - - { id: 1, name: "Alice" }
        - []
    assert:
      type: deepEquals
      value:
        - id: 1
          name: "Alice"
          orders: []
timeoutMs: 3000
hints:
  - ja: "まずuserIdごとにordersをグルーピングするMapを作ると見通しがよくなります"
    en: "Start by building a Map that groups orders by userId"
  - ja: "usersをmapし、各userについて対応するordersのグループ(無ければ空配列)を埋め込みます"
    en: "Map over users and embed the matching group of orders (or an empty array) for each one"
