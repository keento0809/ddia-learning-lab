slug: 03-storage/mini-kv-lab
language: js
entry: put
template: |
  // 「追記型ログ + ハッシュインデックス」で動くミニKVストアを実装してください。
  //
  // store は次の形をしたイミュータブルなオブジェクトです。
  //   {
  //     log: [{ key, value }, ...],  // 書き込まれた順に並ぶ追記型ログ
  //     index: { [key]: number },     // キー→そのキーの最新エントリのlog配列上の位置(オフセット)
  //   }
  //
  // put(store, key, value) を実装してください。
  // - 引数のstoreを直接書き換えてはいけません(新しいオブジェクトを返します)。
  // - 新しいlogは、既存のlogの末尾に { key, value } を追記した配列にします
  //   (同じキーが既にあっても上書きはせず、新しいエントリを末尾に追加します)。
  // - 新しいindexは、既存のindexをコピーしたうえで、
  //   index[key] を「追記した後のlog配列でのそのエントリの位置(log.length - 1)」
  //   に更新したものにします。
  // - { log: 新しいlog, index: 新しいindex } を返してください。
  export function put(store, key, value) {
    // TODO: 実装
  }

  // get(store, key) を実装してください。
  // - store.index に key が存在すれば、その位置(オフセット)にある
  //   store.log のエントリの value を返してください。
  // - store.index に key が存在しなければ null を返してください。
  // - log を先頭から探索する必要はありません(indexが位置を直接教えてくれます)。
  export function get(store, key) {
    // TODO: 実装
  }
tests:
  - id: t1-put-empty-store
    name:
      ja: "空のstoreにputすると1件のログとインデックスができる"
      en: "put on an empty store creates a one-entry log and index"
    call:
      fn: "put"
      args:
        - { log: [], index: {} }
        - "a"
        - "1"
    assert:
      type: "deepEquals"
      value:
        log: [{ key: "a", value: "1" }]
        index: { a: 0 }
  - id: t2-put-overwrite-appends
    name:
      ja: "既存キーへのputは上書きではなく末尾への追記になる"
      en: "put on an existing key appends rather than overwriting"
    call:
      fn: "put"
      args:
        - { log: [{ key: "a", value: "1" }], index: { a: 0 } }
        - "a"
        - "2"
    assert:
      type: "deepEquals"
      value:
        log: [{ key: "a", value: "1" }, { key: "a", value: "2" }]
        index: { a: 1 }
  - id: t3-put-new-key-keeps-existing
    name:
      ja: "新しいキーへのputは既存のログとインデックスを保ったまま追加する"
      en: "put on a new key preserves the existing log and index while adding to them"
    call:
      fn: "put"
      args:
        - log: [{ key: "a", value: "1" }, { key: "b", value: "x" }]
          index: { a: 0, b: 1 }
        - "c"
        - "y"
    assert:
      type: "deepEquals"
      value:
        log: [{ key: "a", value: "1" }, { key: "b", value: "x" }, { key: "c", value: "y" }]
        index: { a: 0, b: 1, c: 2 }
  - id: t4-get-returns-latest-via-index
    name:
      ja: "getはlogを先頭から探すのではなくindexが指す最新の値を返す"
      en: "get returns the newest value via the index rather than scanning the log"
    call:
      fn: "get"
      args:
        - log: [{ key: "a", value: "1" }, { key: "a", value: "2" }]
          index: { a: 1 }
        - "a"
    assert: { type: "equals", value: "2" }
  - id: t5-get-missing-key
    name:
      ja: "存在しないキーのgetはnullを返す"
      en: "get on a missing key returns null"
    call:
      fn: "get"
      args:
        - { log: [{ key: "a", value: "1" }], index: { a: 0 } }
        - "x"
    assert: { type: "equals", value: null }
  - id: t6-get-empty-store
    name:
      ja: "空のstoreに対するgetはnullを返す"
      en: "get on an empty store returns null"
    call:
      fn: "get"
      args:
        - { log: [], index: {} }
        - "a"
    assert: { type: "equals", value: null }
timeoutMs: 3000
hints:
  - ja: "putは引数のstoreを書き換えず、新しいlogとindexを持つ新しいオブジェクトを返します。スプレッド構文([...store.log, ...]や{...store.index, ...})でコピーすると書きやすいです"
    en: "put must not mutate the store argument — return a new object with a new log and index. Spread syntax ([...store.log, ...] / {...store.index, ...}) makes this easy to write"
  - ja: "同じキーに何度putしても、logには新しいエントリが追加され続けます。indexだけが常に最新の位置(追記後のlog.length - 1)を指すように更新されます"
    en: "Putting the same key repeatedly keeps appending new entries to the log. Only the index is updated to point at the newest position (log.length - 1 after appending)"
  - ja: "getはstore.indexからkeyに対応するオフセットを引き、store.log[offset].valueを返すだけです。indexにkeyが無ければnullを返します"
    en: "get just looks up the offset for key in store.index and returns store.log[offset].value; return null if the key is not in the index"
