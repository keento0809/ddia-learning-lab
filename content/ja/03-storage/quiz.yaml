questions:
  - id: q1
    prompt: "追記型ログ+ハッシュインデックス方式のキーバリューストアについて、正しい説明はどれか?"
    type: single
    options:
      - id: b
        label: "書き込みは常にファイル末尾へのシーケンシャルな追記になる"
      - id: a
        label: "インデックス全体が必ずしもメモリに収まっている必要はない"
      - id: c
        label: "範囲検索(キーの大小関係を使った検索)が得意である"
      - id: d
        label: "削除操作は既存のレコードをその場で消すことで表現する"
    correctOptionIds: [b]
    explanation: "追記型ログは常に末尾へ追記する設計であり、これが高速な書き込みの理由になっている。インデックスはメモリに収まる必要があり、範囲検索は苦手で、削除はトゥームストーンの追記で表現する。"
  - id: q2
    prompt: "ハッシュインデックスを用いたキーバリューストアで、あるキーを削除したい場合の一般的な表現方法はどれか?"
    type: single
    options:
      - id: a
        label: "ログ内の該当行を直接書き換えて消す"
      - id: c
        label: "インデックスからそのキーのエントリを削除するだけでログには何もしない"
      - id: b
        label: "削除を表す特別な値(トゥームストーン)を新しいエントリとして追記する"
      - id: d
        label: "ログファイル全体を作り直す"
    correctOptionIds: [b]
    explanation: "追記型ログは既存の内容を書き換えないため、削除もトゥームストーンという新しいエントリの追記として表現し、以降の読み取り・コンパクションがそれを見て古い値を無視する。"
  - id: q3
    prompt: "SSTableがハッシュインデックスと比べて範囲検索に強い理由は何か?"
    type: single
    options:
      - id: a
        label: "SSTableはメモリテーブルを経由しないから"
      - id: c
        label: "SSTableはブルームフィルタを持たないから"
      - id: d
        label: "SSTableは常にメモリ上に存在するから"
      - id: b
        label: "SSTable内のエントリがキー順にソートされているため、疎なインデックスでも目的の付近まで辿り着けるから"
    correctOptionIds: [b]
    explanation: "SSTableはキー順にソートされているため、全キーの位置を覚えなくても疎なインデックスで近くまでジャンプしてから順に読めばよく、範囲検索や大規模データへの対応がしやすい。"
  - id: q4
    prompt: "LSM-Treeにおいて、書き込みが最初に反映される場所はどこか?"
    type: single
    options:
      - id: a
        label: "ディスク上の最も古いSSTable"
      - id: b
        label: "メモリ上のメモリテーブル(および耐久性のためのWAL)"
      - id: c
        label: "B-Treeの葉ページ"
      - id: d
        label: "コンパクション後に生成される最終レベルのSSTable"
    correctOptionIds: [b]
    explanation: "LSM-Treeへの書き込みはまずメモリテーブルに適用され、クラッシュ時の耐久性のためにWALにも記録される。一定量たまるとディスク上のSSTableとしてフラッシュされる。"
  - id: q5
    prompt: "LSM-Treeでコンパクションが行われないまま放置されると、どのような問題が起こりやすいか?"
    type: single
    options:
      - id: a
        label: "メモリテーブルが自動的に消去されてしまう"
      - id: b
        label: "同じキーの古い値やトゥームストーンが残り続け、ディスク使用量と読み取り時に調べるファイル数が増える"
      - id: c
        label: "WALが不要になる"
      - id: d
        label: "書き込みが受け付けられなくなる"
    correctOptionIds: [b]
    explanation: "コンパクションを行わないと、同一キーの古い値や不要になったトゥームストーンがSSTable内に残り続け、ディスク使用量と読み取り時に確認すべきファイル数が増加していく。"
  - id: q6
    prompt: "B-Treeインデックスの分岐係数(1ページが指せる子ページの数)が大きいことの主な利点は何か?"
    type: single
    options:
      - id: b
        label: "コンパクションが不要になる"
      - id: c
        label: "書き込みが追記型になる"
      - id: d
        label: "メモリテーブルが不要になる"
      - id: a
        label: "データ量が増えてもツリーの深さが緩やかにしか増えず、検索に必要なページ数を抑えられる"
    correctOptionIds: [a]
    explanation: "分岐係数が大きいほど、同じデータ量に対してツリーの深さを浅く保てるため、根から葉までたどるページ数(≒ディスクアクセス回数)を少なく抑えられる。"
  - id: q7
    prompt: "B-Treeの実装がWrite-Ahead Log(WAL)を併用する主な理由は何か?"
    type: single
    options:
      - id: b
        label: "ページをその場で書き換える途中でクラッシュした場合に備え、変更内容を先に記録して復旧できるようにするため"
      - id: a
        label: "範囲検索を高速化するため"
      - id: c
        label: "列指向ストレージへ変換するため"
      - id: d
        label: "ブルームフィルタの偽陽性を減らすため"
    correctOptionIds: [b]
    explanation: "B-Treeはページをその場で上書きするため、書き込み途中のクラッシュでページが壊れる恐れがある。WALに変更内容を先に記録しておくことで、クラッシュ後にページの内容を正しい状態まで再生できる。"
  - id: q8
    prompt: "列指向ストレージが行指向ストレージより不利になりやすい操作はどれか?"
    type: single
    options:
      - id: a
        label: "特定の1列だけを全行にわたって集計するクエリ"
      - id: b
        label: "値の種類が少ない列の圧縮"
      - id: c
        label: "1件のレコード全体を書き換える更新"
      - id: d
        label: "特定の列だけを読むスキャン"
    correctOptionIds: [c]
    explanation: "1件のレコード全体を更新するには、そのレコードが持つ複数のカラムそれぞれの列ファイルへ書き込む必要があり、行指向ストレージのように1箇所へまとめて書けばよいわけではない。"
