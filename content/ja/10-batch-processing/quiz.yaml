questions:
  - id: q1-map-independence
    type: single
    prompt: "MapReduceのmap関数が、入力を自由に分割して多数のマシンで並列実行できるのはなぜか。"
    options:
      - id: b
        label: "reduce関数が並列実行に対応していないため、map側で並列化を担う必要があるから"
      - id: c
        label: "map関数は必ずディスクへの書き込みを行わないため高速だから"
      - id: d
        label: "シャッフル段階が存在しないバージョンのMapReduceでは並列化が不要だから"
      - id: a
        label: "map関数が他のレコードの状態や処理順序に依存せず、1レコードだけを見て出力を決められるから"
    correctOptionIds: ["a"]
    explanation: "map関数は1レコードだけから出力を決定でき、他のレコードの処理結果に依存しない。この独立性のおかげで入力をいくらでも細かく分割し、マシン間で並列に実行できる。"

  - id: q2-shuffle-role
    type: single
    prompt: "MapReduceのシャッフル段階が担う役割として正しいものはどれか。"
    options:
      - id: a
        label: "reduce関数の出力を最終的な保存先へ書き込む"
      - id: c
        label: "入力データをあらかじめ圧縮してディスク使用量を減らす"
      - id: b
        label: "map段階が出力したキー・値ペアを、同じキー同士が同じreduceタスクに集まるようネットワーク越しに再配置する"
      - id: d
        label: "各mapタスクの実行順序をスケジューラに指示する"
    correctOptionIds: ["b"]
    explanation: "シャッフル段階は、mapが出力した大量のキー・値ペアを、同じキーの値がまとまって1つのreduceタスクに届くようクラスタ全体で再配置する処理である。"

  - id: q3-join-strategy-choice
    type: single
    prompt: "片方の入力データが小さく、クラスタの全マシンのメモリに収まる場合に適した結合戦略はどれか。"
    options:
      - id: a
        label: "毎回フルシャッフルを伴うリデュース側結合"
      - id: c
        label: "両方の入力を毎回ソートし直すソートマージ結合"
      - id: d
        label: "結合キーを無視してすべての組み合わせを出力する結合"
      - id: b
        label: "小さい方の入力を全マシンへ配布しメモリ上のハッシュテーブルとして使うブロードキャストハッシュ結合"
    correctOptionIds: ["b"]
    explanation: "片方の入力がメモリに載る小ささであれば、それを全マシンへ配布してハッシュテーブルとして保持し、シャッフルを行わずに結合できるブロードキャストハッシュ結合が有利である。"

  - id: q4-skewed-key-problem
    type: single
    prompt: "リデュース側結合において、特定のキーにレコードが著しく偏っている(スキューしている)場合に起きやすい問題はどれか。"
    options:
      - id: b
        label: "map段階が完全に実行できなくなりジョブがエラー終了する"
      - id: c
        label: "スキューしたキーのデータだけが自動的に破棄される"
      - id: a
        label: "そのキーを担当するreduceタスクだけが突出して負荷を抱え、他のタスクが終わっていてもジョブ全体の完了が遅れる"
      - id: d
        label: "シャッフル段階が完全にスキップされる"
    correctOptionIds: ["a"]
    explanation: "同じキーの値は1つのreduceタスクに集約されるため、突出して多いキーがあるとそのタスクだけが重くなり、他のタスクが先に終わっていてもボトルネックとしてジョブ全体を長引かせる。"

  - id: q5-dataflow-engine-benefits
    type: multiple
    prompt: "複数のMapReduceジョブを連鎖させる方式と比べて、DAGベースのデータフローエンジンが改善しうる点をすべて選べ。"
    options:
      - id: a
        label: "段階間のデータをディスクへ完全に書き出さず、可能な場合はメモリ上でパイプライン的に受け渡せる"
      - id: b
        label: "フィルタ・結合・集計などの多様なオペレータを1つの計算グラフとして表現・最適化できる"
      - id: c
        label: "計算に必要なディスク書き込みが常に完全にゼロになる"
      - id: d
        label: "反復的な計算で繰り返し使うデータをメモリ上に保持し再利用しやすくなる"
    correctOptionIds: ["a", "b", "d"]
    explanation: "データフローエンジンはパイプライン化・多様なオペレータのグラフ表現・反復計算でのメモリ再利用によって多段階処理を効率化する。ただしメモリに収まらない場合はディスクへのスピルが依然として発生するため、ディスク書き込みが常にゼロになるわけではない。"

  - id: q6-determinism-for-retry
    type: single
    prompt: "map関数・reduce関数が決定的(同じ入力に対し常に同じ出力を返す)であることが、タスクの再実行にとって重要なのはなぜか。"
    options:
      - id: b
        label: "決定的な関数の方が必ず実行速度が速いから"
      - id: c
        label: "決定性はシャッフル段階の通信量を減らすための最適化にすぎないから"
      - id: d
        label: "決定的でない関数はJavaScriptでは実装できないから"
      - id: a
        label: "決定的でないと、失敗したタスクを再実行した結果が元のタスクの結果と食い違い、他タスクの結果と整合的に組み合わせられなくなるから"
    correctOptionIds: ["a"]
    explanation: "タスクは失敗時に別マシンで再実行される前提のため、同じ入力から毎回同じ出力が得られなければ、再実行結果と他の成功済みタスクの結果を安全に組み合わせられない。"

  - id: q7-idempotent-output-write
    type: single
    prompt: "タスクの出力を最終的な保存先へアトミックにリネームしてから公開する設計は、何を防ぐためのものか。"
    options:
      - id: b
        label: "map関数の実行時間が長くなること"
      - id: a
        label: "タスクが再実行された際に、失敗した実行の中途半端な出力が最終結果に混ざったり重複したりすること"
      - id: c
        label: "シャッフル段階でのネットワーク帯域の消費"
      - id: d
        label: "結合処理におけるキーのスキュー"
    correctOptionIds: ["a"]
    explanation: "タスク完了時にのみ出力を最終パスへアトミックに反映することで、再実行や重複実行があっても中途半端な出力や重複が最終結果に紛れ込まないようにできる。"
