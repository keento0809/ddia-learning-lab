questions:
  - id: q1
    prompt: "インピーダンスミスマッチとは何を指す言葉か?"
    type: single
    options:
      - id: a
        label: "ネットワーク遅延によってレプリカ間にデータのずれが生じる現象"
      - id: b
        label: "アプリケーション側の木構造に近いオブジェクト表現と、リレーショナルモデルのフラットな行表現との間のズレ、およびそれを埋める変換コスト"
      - id: c
        label: "異なるデータベース製品間でSQLの方言が異なる問題"
      - id: d
        label: "パーティション分割によってデータの偏りが生じる現象"
    correctOptionIds: [b]
    explanation: "インピーダンスミスマッチは、アプリケーションコード内の(木構造に近い)オブジェクト表現と、リレーショナルモデルのフラットな行表現との構造上のズレ、およびそれを埋めるための変換の手間を指す。"
  - id: q2
    prompt: "1人の利用者が複数の配送先住所を持ち、その住所は常に利用者とセットで読み書きされる場合、ドキュメントモデルで最も素直な表現はどれか?"
    type: single
    options:
      - id: a
        label: "住所ごとに独立したドキュメントを作り、利用者ドキュメントとは一切関連付けない"
      - id: b
        label: "利用者ドキュメントの中に配送先住所の配列を埋め込む"
      - id: c
        label: "住所を別のデータベース製品に保存し、アプリケーション側で常に手動結合する"
      - id: d
        label: "住所を利用者ごとに異なるコレクション名で保存する"
    correctOptionIds: [b]
    explanation: "親エンティティとセットで読み書きされることが多いデータは、ドキュメントへの配列埋め込みと相性がよい。"
  - id: q3
    prompt: "スキーマオンリードの説明として最も適切なものはどれか?"
    type: single
    options:
      - id: a
        label: "書き込み時点でスキーマを確定させ、以降の書き込みがそれに従うことを強制する"
      - id: b
        label: "書き込み時にスキーマを固定せず、読み取り側がそのつどデータの構造を解釈する"
      - id: c
        label: "スキーマという概念自体が存在しないデータモデル"
      - id: d
        label: "読み取りのたびに必ずマイグレーションを実行する仕組み"
    correctOptionIds: [b]
    explanation: "スキーマオンリードは書き込み時の形式強制を行わず、データの構造解釈の責任が読み取り側のコードに移る運用方式である。"
  - id: q4
    prompt: "非正規化のデメリットとして最も適切なものはどれか?"
    type: single
    options:
      - id: a
        label: "読み取り時に複数テーブルの結合が常に必要になる"
      - id: b
        label: "コピーしたデータの更新が必要になったとき、コピーした全箇所を漏れなく更新しないと不整合が生じる"
      - id: c
        label: "ストレージの使用量が正規化より必ず少なくなる"
      - id: d
        label: "多対多の関係を一切表現できなくなる"
    correctOptionIds: [b]
    explanation: "非正規化はデータをコピーして読み取りコストを下げる代わりに、更新時にすべてのコピー箇所を一貫して直す責任を引き受ける必要がある。"
  - id: q5
    prompt: "多対多の関係(例: 利用者とグループが互いに複数対複数で参加し合う)を安全に表現する方法として最も適切なものはどれか?"
    type: single
    options:
      - id: a
        label: "利用者ドキュメントの中にグループ一覧を、グループドキュメントの中にも利用者一覧を、それぞれ独立に埋め込んで二重管理する"
      - id: b
        label: "利用者IDとグループIDの組だけを持つ中間テーブル(連関テーブル)や、それに相当する参照構造で表現する"
      - id: c
        label: "利用者とグループを常に1つのドキュメントに統合し、別々に扱わないようにする"
      - id: d
        label: "多対多の関係は表現できないため、片方の情報を諦める"
    correctOptionIds: [b]
    explanation: "多対多の関係は、片側だけへの埋め込みだと二重管理で不整合が起きやすいため、IDの組を持つ中間テーブル(または同等の参照構造)で表現するのが安全である。"
  - id: q6
    prompt: "グラフデータモデルの採用を検討する動機として最も適切なものはどれか?"
    type: single
    options:
      - id: a
        label: "関係の種類が少なく固定的で、集計処理が中心のデータを扱いたい"
      - id: b
        label: "関係の種類が多く、かつ何段つながっているか分からない経路をたどるクエリが中心的なユースケースになっている"
      - id: c
        label: "1つのエンティティの情報をとにかく1回の読み取りでまとめて取得したいだけ"
      - id: d
        label: "書き込みスループットを最優先したいバッチ集計処理を行いたい"
    correctOptionIds: [b]
    explanation: "グラフモデルは関係の種類が多く、経路をたどるクエリ(段数が事前に決まっていないものを含む)が中心になる場面で強みを発揮する。"
  - id: q7
    prompt: "リレーショナルモデルにおける「関係」の表現について正しい説明はどれか?"
    type: single
    options:
      - id: a
        label: "関係そのものが頂点や辺と同様に一級のデータとして扱われる"
      - id: b
        label: "外部キーという間接的な形でしか表現できない"
      - id: c
        label: "関係は常にドキュメントへの埋め込みによって表現される"
      - id: d
        label: "リレーショナルモデルでは関係を一切表現できない"
    correctOptionIds: [b]
    explanation: "リレーショナルモデルでは、テーブル間の関係は外部キー(参照先の識別子)という間接的な形でしか表現されない。これに対しグラフデータモデルでは関係そのものが辺として一級のデータになる。"
