slug: "02-data-models/join-cost-lab"
language: js
entry: countLookups
template: |
  // 「root件数(rootCount)分のレコードと、それぞれに紐づく関連データを
  // まとめて読み出す」というクエリについて、shapeが正規化("normalized")か
  // 非正規化("denormalized")かによって必要な参照(lookup)回数がどう変わるかを
  // 返す。
  // - shapeが"normalized"の場合: rootレコード群をまとめて取得する参照が1回、
  //   さらに関連データはroot 1件ごとに別テーブルへの参照が1回ずつ必要になる
  //   (関連テーブルへの参照はバッチ結合されず、root 1件につき1回とする)。
  //   合計は 1 + rootCount 回。
  // - shapeが"denormalized"の場合: 関連データはrootレコードにあらかじめ
  //   埋め込まれているため、rootレコード群を取得する参照1回だけで完結する。
  //   rootCountの値によらず常に1回。
  export function countLookups(shape, rootCount) {
    // TODO: 実装
  }
tests:
  - id: t1
    name:
      ja: "正規化: root 5件なら参照は6回"
      en: "Normalized: 5 roots need 6 lookups"
    call: { fn: "countLookups", args: ["normalized", 5] }
    assert: { type: "equals", value: 6 }
  - id: t2
    name:
      ja: "非正規化: root 5件でも参照は1回のまま"
      en: "Denormalized: 5 roots still need only 1 lookup"
    call: { fn: "countLookups", args: ["denormalized", 5] }
    assert: { type: "equals", value: 1 }
  - id: t3
    name:
      ja: "正規化の境界値: root 0件でも参照は1回"
      en: "Normalized boundary: 0 roots still need 1 lookup"
    call: { fn: "countLookups", args: ["normalized", 0] }
    assert: { type: "equals", value: 1 }
  - id: t4
    name:
      ja: "非正規化の境界値: root 0件でも参照は1回"
      en: "Denormalized boundary: 0 roots still need 1 lookup"
    call: { fn: "countLookups", args: ["denormalized", 0] }
    assert: { type: "equals", value: 1 }
  - id: t5
    name:
      ja: "正規化: root件数が増えると参照回数も線形に増える"
      en: "Normalized: lookups grow linearly with root count"
    call: { fn: "countLookups", args: ["normalized", 100] }
    assert: { type: "equals", value: 101 }
  - id: t6
    name:
      ja: "非正規化: root件数が増えても参照回数は一定"
      en: "Denormalized: lookups stay constant as root count grows"
    call: { fn: "countLookups", args: ["denormalized", 100] }
    assert: { type: "equals", value: 1 }
timeoutMs: 3000
hints:
  - ja: "shapeで分岐し、normalizedのときだけrootCountを足し込みます"
    en: "Branch on shape, and only add rootCount when shape is normalized"
  - ja: "denormalizedは常に1を返すだけで十分です"
    en: "For denormalized, simply returning 1 is enough"
