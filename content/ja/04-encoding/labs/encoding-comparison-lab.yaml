slug: 04-encoding/encoding-comparison-lab
language: js
entry: encodeCompact
template: |
  // エンコード比較ラボ
  //
  // 同じレコード(プレーンオブジェクト)を (a) JSON と (b) 自作の簡易バイナリ形式
  // の両方でエンコードし、バイト数と往復変換(エンコード→デコードで元に戻るか)を
  // 比較します。
  //
  // 「スキーマ」は次の形の配列で表します。
  //   [{ tag: 1, key: "deviceId", type: "uint32" },
  //    { tag: 2, key: "active",   type: "bool" },
  //    { tag: 3, key: "label",    type: "string" }]
  //
  // 自作バイナリ形式(1フィールドあたりのバイト列)のレイアウト:
  //   1バイト: タグ番号
  //   1バイト: 型コード(0=uint32, 1=bool, 2=string)
  //   ペイロード:
  //     - uint32: 4バイト(ビッグエンディアン、符号なし32bit整数)
  //     - bool:   1バイト(0=false, 1=true)
  //     - string: 2バイト(ビッグエンディアン、UTF-8バイト長)+ 本体のUTF-8バイト列
  //   record にキーが存在しない(または値がundefined)フィールドは書き出しません。
  //
  // typeCode(type) は実装済みです(変更不要)。
  function typeCode(type) {
    if (type === "uint32") return 0;
    if (type === "bool") return 1;
    return 2;
  }

  // encodeCompact(record, schema) を実装してください。
  // schema の並び順どおりに各フィールドを走査し、record にそのキーが存在する
  // ものだけを上記レイアウトでエンコードし、バイト値(0〜255)の配列として
  // 返してください。
  export function encodeCompact(record, schema) {
    // TODO: 実装
  }

  // decodeCompact(bytes, schema) を実装してください。
  // bytes(encodeCompactが返すようなバイト配列)を先頭から読み進め、
  // タグ番号がschema内に存在するフィールドだけを結果オブジェクトへ格納して
  // 返してください。schemaに存在しないタグに出会った場合は、型コードから
  // ペイロード長を判断して正しく読み飛ばし(結果には含めず)、次のフィールドの
  // 読み取りを続けてください。
  export function decodeCompact(bytes, schema) {
    // TODO: 実装
  }

  // jsonByteSize(record) を実装してください。
  // JSON.stringify(record) をUTF-8エンコードしたときのバイト数を返してください
  // (TextEncoderのencode結果のlengthを使えます)。
  export function jsonByteSize(record) {
    // TODO: 実装
  }

  // compactByteSize(record, schema) を実装してください。
  // encodeCompact(record, schema) の結果のバイト数(配列長)を返してください。
  export function compactByteSize(record, schema) {
    // TODO: 実装
  }

  // isCompactSmaller(record, schema) を実装してください。
  // compactByteSize(record, schema) が jsonByteSize(record) より小さいかどうかを
  // boolean で返してください。
  export function isCompactSmaller(record, schema) {
    // TODO: 実装
  }
tests:
  - id: t1
    name:
      ja: "encodeCompact: フィールドがすべて揃ったレコードを正しくエンコードする"
      en: "encodeCompact: correctly encodes a record with every field present"
    call:
      fn: encodeCompact
      args:
        - { deviceId: 42, active: true, label: "sensor-a" }
        - - { tag: 1, key: "deviceId", type: "uint32" }
          - { tag: 2, key: "active", type: "bool" }
          - { tag: 3, key: "label", type: "string" }
    assert:
      type: deepEquals
      value: [1, 0, 0, 0, 0, 42, 2, 1, 1, 3, 2, 0, 8, 115, 101, 110, 115, 111, 114, 45, 97]
  - id: t2
    name:
      ja: "encodeCompact: レコードに存在しないフィールドは書き出さない(省略可能フィールド)"
      en: "encodeCompact: a field missing from the record is simply omitted (optional field)"
    call:
      fn: encodeCompact
      args:
        - { deviceId: 5, active: true }
        - - { tag: 1, key: "deviceId", type: "uint32" }
          - { tag: 2, key: "active", type: "bool" }
          - { tag: 3, key: "label", type: "string" }
    assert:
      type: deepEquals
      value: [1, 0, 0, 0, 0, 5, 2, 1, 1]
  - id: t3
    name:
      ja: "往復変換: encodeCompactしてdecodeCompactすると元のレコードに戻る"
      en: "round trip: decoding an encoded record returns the original record"
    call:
      fn: decodeCompact
      args:
        - [1, 0, 0, 0, 0, 42, 2, 1, 1, 3, 2, 0, 8, 115, 101, 110, 115, 111, 114, 45, 97]
        - - { tag: 1, key: "deviceId", type: "uint32" }
          - { tag: 2, key: "active", type: "bool" }
          - { tag: 3, key: "label", type: "string" }
    assert:
      type: deepEquals
      value: { deviceId: 42, active: true, label: "sensor-a" }
  - id: t4
    name:
      ja: "前方互換性: 新しいスキーマで追加されたタグを、古いスキーマでdecodeすると安全に無視される"
      en: "forward compatibility: decoding with the old schema safely skips a tag added by the new schema"
    call:
      fn: decodeCompact
      args:
        - [1, 0, 0, 0, 0, 7, 2, 1, 0, 3, 2, 0, 8, 115, 101, 110, 115, 111, 114, 45, 98, 4, 0, 0, 0, 0, 3]
        - - { tag: 1, key: "deviceId", type: "uint32" }
          - { tag: 2, key: "active", type: "bool" }
          - { tag: 3, key: "label", type: "string" }
    assert:
      type: deepEquals
      value: { deviceId: 7, active: false, label: "sensor-b" }
  - id: t5
    name:
      ja: "jsonByteSize: JSONエンコード結果のバイト数を正しく計算する"
      en: "jsonByteSize: correctly computes the UTF-8 byte size of the JSON encoding"
    call:
      fn: jsonByteSize
      args:
        - { deviceId: 42, active: true, label: "sensor-a" }
    assert: { type: equals, value: 48 }
  - id: t6
    name:
      ja: "compactByteSize: 自作バイナリ形式のバイト数を正しく計算する"
      en: "compactByteSize: correctly computes the byte size of the custom binary encoding"
    call:
      fn: compactByteSize
      args:
        - { deviceId: 42, active: true, label: "sensor-a" }
        - - { tag: 1, key: "deviceId", type: "uint32" }
          - { tag: 2, key: "active", type: "bool" }
          - { tag: 3, key: "label", type: "string" }
    assert: { type: equals, value: 21 }
  - id: t7
    name:
      ja: "isCompactSmaller: 同じレコードでは自作バイナリ形式の方がJSONより小さくなる"
      en: "isCompactSmaller: the custom binary encoding is smaller than JSON for the same record"
    call:
      fn: isCompactSmaller
      args:
        - { deviceId: 42, active: true, label: "sensor-a" }
        - - { tag: 1, key: "deviceId", type: "uint32" }
          - { tag: 2, key: "active", type: "bool" }
          - { tag: 3, key: "label", type: "string" }
    assert: { type: equals, value: true }
timeoutMs: 3000
hints:
  - ja: "encodeCompactはschemaを順番に走査し、record[field.key]が存在するときだけタグ・型コード・ペイロードをこの順でbytes配列にpushしていきます"
    en: "encodeCompact walks schema in order and, only when record[field.key] exists, pushes tag, type code, then payload bytes in that order"
  - ja: "uint32は4バイトのビッグエンディアンです。(n >>> 24) & 0xff のようにビットシフトで各バイトを取り出せます"
    en: "uint32 is 4 bytes big-endian; you can extract each byte with bit shifts like (n >>> 24) & 0xff"
  - ja: "stringはUTF-8のバイト長を2バイト(ビッグエンディアン)で先に書き、その後に本体のバイト列を続けます。TextEncoderが使えます"
    en: "a string writes its UTF-8 byte length as 2 big-endian bytes first, then the body bytes; TextEncoder is available"
  - ja: "decodeCompactは常にタグと型コードの2バイトをまず読み、型コードからペイロード長を決めてから、schemaにそのタグがあるときだけ結果へ格納します(なくても読み進める処理自体は続けます)"
    en: "decodeCompact always reads the tag and type code (2 bytes) first, determines the payload length from the type code, and only stores the value into the result if that tag exists in schema (parsing continues either way)"
