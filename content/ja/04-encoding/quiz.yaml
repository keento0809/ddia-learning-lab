questions:
  - id: q1
    prompt: "テキスト形式(JSON等)がバイナリ形式と比べて一般に苦手とすることは何か?"
    type: single
    options:
      - id: a
        label: "curlやブラウザの開発者ツールで内容をそのまま確認できること"
      - id: b
        label: "フィールド名の文字列を毎回書き出さずに済ませ、サイズをコンパクトに抑えること"
      - id: c
        label: "多くのプログラミング言語ですぐに読み書きできること"
      - id: d
        label: "デバッグ時に内容を目視で追えること"
    correctOptionIds: [b]
    explanation: "テキスト形式はフィールド名や区切り文字をそのまま出力するため、同じ情報量でもバイナリ形式よりサイズが大きくなりがちである。"
  - id: q2
    prompt: "スキーマベースのバイナリ形式で、フィールド名の代わりに小さい整数の「タグ」を使う設計にする主な狙いは何か?"
    type: single
    options:
      - id: a
        label: "タグを使うとエンコードが必ず人間可読になるため"
      - id: b
        label: "位置ではなくタグ番号でフィールドを識別できるため、スキーマの変更に対して柔軟に対応できる"
      - id: c
        label: "タグを使うとスキーマの共有が不要になるため"
      - id: d
        label: "タグはネットワーク越しの認証に使われるため"
    correctOptionIds: [b]
    explanation: "タグ番号による識別は、フィールドの追加・不使用化があっても新旧のデータを区別して正しく解釈できるようにするための仕組みである。"
  - id: q3
    prompt: "新しいバージョンのコードが、古いバージョンのコードが書いたデータを正しく読める性質のことを何と呼ぶか?"
    type: single
    options:
      - id: a
        label: "前方互換性"
      - id: b
        label: "後方互換性"
      - id: c
        label: "水平スケーラビリティ"
      - id: d
        label: "冪等性"
    correctOptionIds: [b]
    explanation: "「新しいコードが過去(後方)のデータを読める」という意味で後方互換性と呼ばれる。逆方向は前方互換性である。"
  - id: q4
    prompt: "スキーマにフィールドを追加する変更について、互換性の観点から最も注意すべき点はどれか?"
    type: single
    options:
      - id: a
        label: "追加したフィールドを必須値として扱うと、そのフィールドを持たない古いデータを新しいコードが読めなくなる"
      - id: b
        label: "フィールドを追加すると常にすべての互換性が自動的に保たれる"
      - id: c
        label: "フィールドの追加はタグ番号の再利用を必ず伴う"
      - id: d
        label: "フィールドを追加すると既存のタグ番号がすべて無効になる"
    correctOptionIds: [a]
    explanation: "新しいタグでのフィールド追加自体は比較的安全だが、そのフィールドを必須として扱うと後方互換性(古いデータの読み込み)が崩れる。"
  - id: q5
    prompt: "一度使ったフィールドタグ番号を、削除後に別の意味のフィールドへ再利用するとどうなるか?"
    type: single
    options:
      - id: a
        label: "常に安全であり、何の問題も起きない"
      - id: b
        label: "古いデータに残っていた同じタグ番号のバイト列を、新しい意味のフィールドとして誤って解釈してしまう危険がある"
      - id: c
        label: "エンコードのサイズが必ず小さくなる"
      - id: d
        label: "スキーマの定義自体が不要になる"
    correctOptionIds: [b]
    explanation: "削除したタグ番号を再利用すると、古いデータの同じタグ位置にあるバイト列を新しい意味のフィールドとして誤読してしまう事故につながる。"
  - id: q6
    prompt: "ローリングデプロイの途中、まだ更新されていない旧バージョンのサーバーが、更新済みの新バージョンのサーバーが書いたデータを読み込む必要がある場面で求められる互換性はどちらか?"
    type: single
    options:
      - id: a
        label: "後方互換性"
      - id: b
        label: "前方互換性"
      - id: c
        label: "参照整合性"
      - id: d
        label: "直列化可能性"
    correctOptionIds: [b]
    explanation: "古いコードが新しいコードの書いたデータを読む必要がある状況なので、前方互換性が求められる。"
  - id: q7
    prompt: "メッセージキューを介したデータフローが、直接のRPC呼び出しと比べて持つ特徴は何か?"
    type: single
    options:
      - id: a
        label: "送信者と受信者が常に同時にオンラインである必要がある"
      - id: b
        label: "受信側が一時的に落ちていてもメッセージがキューに残り、復旧後に処理できる"
      - id: c
        label: "エンコード形式の互換性を考慮する必要が一切なくなる"
      - id: d
        label: "必ず送信者と受信者が1対1の関係になる"
    correctOptionIds: [b]
    explanation: "メッセージキューは仲介役としてメッセージを保持するため、送信者・受信者が同時にオンラインである必要がない。"
  - id: q8
    prompt: "データベースへの書き込みを経由するデータフローで、互換性が問題になりやすい典型的な状況はどれか?"
    type: single
    options:
      - id: a
        label: "同一プロセスが一度も再起動しない場合"
      - id: b
        label: "書き込んだ時点のコードのバージョンと、読み出す時点のコードのバージョンが異なる場合(アプリのアップデートやロールバックを含む)"
      - id: c
        label: "データベースを一切使わずメモリ上だけで完結する処理"
      - id: d
        label: "読み取り専用のレプリカが存在しない構成"
    correctOptionIds: [b]
    explanation: "データベースに保存されたデータは、書き込み時と読み出し時でアプリケーションのコードバージョンが異なりうる(アップデートやロールバックを含む)ため、両方向の互換性が重要になる。"
