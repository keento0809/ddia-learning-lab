questions:
  - id: q1-log-vs-queue
    type: single
    prompt: "追記専用のイベントログを使ったメッセージ配信が、伝統的な「配送後に削除される」メッセージキューと比べて優れている点として最も適切なものはどれか。"
    options:
      - id: b
        label: "メッセージが必ず1回だけ配送されることが保証される"
      - id: a
        label: "複数のコンシューマーグループが、それぞれ独立したオフセットで同じイベントを別々のペースで読み進められる"
      - id: c
        label: "ディスク容量を一切消費しない"
      - id: d
        label: "コンシューマーがオフセットを管理する必要がなくなる"
    correctOptionIds: ["a"]
    explanation: "ログはコンシューマーに読まれても削除されないため、複数のコンシューマーグループがそれぞれ自分のオフセットを持って独立に読み進められる(ファンアウト)。これが伝統的なキューとの主な違いである。"

  - id: q2-consumer-offset
    type: single
    prompt: "コンシューマオフセットの役割として正しいものはどれか。"
    options:
      - id: b
        label: "あるコンシューマーがログのどこまで読み終えたかを示す位置"
      - id: a
        label: "イベントログ全体の保持期間を決める設定値"
      - id: c
        label: "ウィンドウ集計の幅(ミリ秒)を表す値"
      - id: d
        label: "イベント発生時のタイムゾーン情報"
    correctOptionIds: ["b"]
    explanation: "コンシューマオフセットは、あるコンシューマーがログのどの位置まで処理済みかを表す。これにより各コンシューマーが自分のペースで独立して読み進められる。"

  - id: q3-dual-write-problem
    type: single
    prompt: "アプリケーションコードがDBへの書き込みとイベント送信を別々に行う「二重書き込み」が問題になる理由はどれか。"
    options:
      - id: b
        label: "DBへの書き込みが常にイベント送信より遅くなるため"
      - id: c
        label: "イベントストリームがトランザクションを一切サポートしないため常に不整合になるため"
      - id: d
        label: "二重書き込みは技術的に実装不可能なため"
      - id: a
        label: "2つの別々の書き込みの間でクラッシュ等が起きると、片方だけ成功する不整合を避けられないため"
    correctOptionIds: ["a"]
    explanation: "DBへの書き込みとイベント送信は別々のシステムへの独立した操作であるため、両方をまとめて原子的に成功/失敗させることができず、片方だけが成功する不整合が生じ得る。"

  - id: q4-outbox-pattern
    type: single
    prompt: "アウトボックスパターンが二重書き込み問題を回避する仕組みとして正しいものはどれか。"
    options:
      - id: b
        label: "イベント送信を先に行い、成功した場合のみDBへ書き込む"
      - id: a
        label: "本来のデータ更新と送信すべきイベントの記録を、同一のデータベーストランザクション内で行う"
      - id: c
        label: "DBへの書き込みを完全に廃止し、イベントストリームのみを正とする"
      - id: d
        label: "複数のデータベースにまたがる分散トランザクションを使う"
    correctOptionIds: ["a"]
    explanation: "アウトボックスパターンは、本来のデータ更新と送信すべきイベントの記録を単一のDBトランザクションにまとめることで、二重書き込み問題を単一データストア内の原子性の問題に還元する。"

  - id: q5-tumbling-vs-sliding
    type: single
    prompt: "タンブリングウィンドウとスライディングウィンドウの違いについて正しい説明はどれか。"
    options:
      - id: b
        label: "スライディングウィンドウは常にタンブリングウィンドウより計算コストが低い"
      - id: c
        label: "タンブリングウィンドウは1つのイベントが複数のウィンドウに属することを許す"
      - id: a
        label: "タンブリングウィンドウは重複しない固定長の区間に区切るが、スライディングウィンドウは指定したステップ幅で区間をずらすため隣接するウィンドウが重なり得る"
      - id: d
        label: "スライディングウィンドウには終了時刻の概念が存在しない"
    correctOptionIds: ["a"]
    explanation: "タンブリングウィンドウは重複のない固定長の区間、スライディングウィンドウはウィンドウ幅とは別のステップ幅で区間をずらすため、1つのイベントが複数のウィンドウに含まれ得る。"

  - id: q6-event-time-vs-processing-time
    type: single
    prompt: "イベント時刻と処理時刻の違いに関する説明として正しいものはどれか。"
    options:
      - id: b
        label: "イベント時刻と処理時刻は常に同じ値になる"
      - id: c
        label: "処理時刻を基準にすると、ストリームを再生して再計算しても常に同じ集計結果が得られる"
      - id: d
        label: "イベント時刻は処理システムのサーバー時計から取得される"
      - id: a
        label: "イベント時刻は実際に事象が発生した時刻、処理時刻はストリーム処理システムがそのイベントを処理した時刻であり、両者は一致するとは限らない"
    correctOptionIds: ["a"]
    explanation: "イベント時刻(事象発生時刻)と処理時刻(処理された時刻)はネットワーク遅延や再送などの理由でずれることがあり、両者は区別して扱う必要がある。"

  - id: q7-watermark-and-late-events
    type: multiple
    prompt: "ウォーターマークと遅延到着イベントについて正しい記述をすべて選べ。"
    options:
      - id: a
        label: "ウォーターマークは、これより前のイベント時刻を持つイベントはもう届かないとみなしてよい、という推測を表す指標である"
      - id: b
        label: "許容遅延を長く取ると、遅延イベントを取りこぼしにくくなる一方でウィンドウの確定までの時間が伸びる"
      - id: c
        label: "遅延到着イベントとは、ウォーターマークがそのウィンドウの終了時刻を追い越した後に届くイベントのことである"
      - id: d
        label: "ウォーターマークを導入すれば遅延イベントは理論上すべて取りこぼさずに集計できる"
    correctOptionIds: ["a", "b", "c"]
    explanation: "ウォーターマークは推測に基づく指標であるため、どれだけ許容遅延を長く取っても「絶対に取りこぼさない」保証はできない。許容遅延とウィンドウ確定の速さはトレードオフの関係にある。"
