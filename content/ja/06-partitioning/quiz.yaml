questions:
  - id: q1
    type: single
    prompt: "キーレンジ分割の特徴として正しいものはどれか。"
    options:
      - id: a
        label: "隣接するキーが同じパーティションに集まりやすく、範囲スキャンが得意になる"
      - id: b
        label: "キーを必ずハッシュ関数に通してから配置する"
      - id: c
        label: "ノード数を変えてもキーの再配置は一切発生しない"
      - id: d
        label: "データの分布に関わらず常に負荷が均等になる"
    correctOptionIds: [a]
    explanation: "キーレンジ分割は連続したキー範囲を1パーティションに割り当てるため、範囲スキャンで少数のパーティションだけを見れば済みやすい。一方でレンジ境界の調整は継続的に必要で、負荷が自動的に均等になるわけではない。"
  - id: q2
    type: single
    prompt: "ハッシュ分割の弱点として正しいものはどれか。"
    options:
      - id: a
        label: "キーの順序情報が失われるため、範囲スキャンが複数パーティションへの問い合わせを必要とする"
      - id: b
        label: "キーの出現分布が偏っていると必ず負荷も偏る"
      - id: c
        label: "パーティション数を1つに固定しなければならない"
      - id: d
        label: "同じキーを複数回書き込まないと保存できない"
    correctOptionIds: [a]
    explanation: "ハッシュ化によりキーの辞書順が失われるため、範囲を指定したクエリは複数パーティションにまたがりやすくなる。負荷分散という点ではハッシュ分割はむしろ有利に働くことが多い。"
  - id: q3
    type: single
    prompt: "ハッシュ値をノード数で割った余り(mod演算)でパーティションを決める単純な方式で、ノードを1台追加すると何が起きやすいか。"
    options:
      - id: a
        label: "割る数が変わるため、ほぼ全てのキーの担当ノードが変わってしまう"
      - id: b
        label: "追加したノードにだけ新しいキーが書き込まれ、既存の担当関係は変わらない"
      - id: c
        label: "何も変化は起きない"
      - id: d
        label: "削除されたノードが担当していたキーだけが再配置される"
    correctOptionIds: [a]
    explanation: "mod演算の除数(ノード数)が変わると、ほとんどのキーについて余りの値も変わるため、担当ノードの対応関係が広範囲で崩れてしまう。"
  - id: q4
    type: single
    prompt: "コンシステントハッシュが単純なmod演算方式と比べて優れている点は何か。"
    options:
      - id: a
        label: "ノードの追加・削除時に再配置が必要なキーの範囲を、ノード1台分の区間程度に限定できる"
      - id: b
        label: "ハッシュ関数を使わずにパーティションを決められる"
      - id: c
        label: "常に完全に均等な負荷分散を数学的に保証する"
      - id: d
        label: "範囲スキャンの速度がキーレンジ分割より速くなる"
    correctOptionIds: [a]
    explanation: "コンシステントハッシュはノードとキーを同じリング上に配置し、影響範囲をノードの前後区間に限定する設計であり、完全な均等性や範囲スキャンの高速化を保証するものではない。"
  - id: q5
    type: single
    prompt: "コンシステントハッシュにおいて仮想ノード(vnode)を増やすことで期待できる効果は何か。"
    options:
      - id: a
        label: "ノードあたりの担当キー数のばらつき(標準偏差)が小さくなりやすい"
      - id: b
        label: "ハッシュ計算そのものが不要になる"
      - id: c
        label: "リバランス作業が完全に不要になる"
      - id: d
        label: "範囲スキャンが可能になる"
    correctOptionIds: [a]
    explanation: "物理ノードあたりの点(仮想ノード)を増やすほど、リング上の担当区間の長さのばらつきが統計的に小さくなり、キー数の均一化が進む。ただしリバランス自体が不要になるわけではない。"
  - id: q6
    type: multiple
    prompt: "ホットスポットの緩和策として有効なものを全て選べ。"
    options:
      - id: a
        label: "ホットになりやすいキーにランダムな接尾辞を付けて複数キーに分散させる(ソルティング)"
      - id: b
        label: "連番やタイムスタンプをそのままパーティションキーの先頭に使い続ける"
      - id: c
        label: "パーティションごとの負荷を継続的に監視し、偏りを検知したら対応する"
      - id: d
        label: "ハッシュ分割に切り替えれば、単一キーへのアクセス集中は自動的に解消する"
    correctOptionIds: [a, c]
    explanation: "ソルティングと継続的な監視は有効な緩和策になる。連番キーをそのまま使い続けることはホットスポットを悪化させやすく、ハッシュ分割への切り替えは単一キーへの集中アクセス自体は解消しない。"
  - id: q7
    type: single
    prompt: "自動リバランスの主なリスクとして挙げられるものはどれか。"
    options:
      - id: a
        label: "検知の誤判定やタイミングの偶然が重なり、意図しない時間帯に大量のデータ移動が走ること"
      - id: b
        label: "オペレーターの作業負担が常に増加すること"
      - id: c
        label: "ノードの追加自体ができなくなること"
      - id: d
        label: "ハッシュ関数が使用できなくなること"
    correctOptionIds: [a]
    explanation: "自動リバランスはオペレーターの手間を減らせる一方、しきい値検知の誤りやタイミングが重なると、性能に影響する時間帯に大量のデータ移動が走るリスクがある。"
