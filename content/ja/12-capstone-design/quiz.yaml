questions:
  - id: q1-unbundling-definition
    type: single
    prompt: "アンバンドリングの説明として最も適切なものはどれか。"
    options:
      - id: b
        label: "1つのデータベース製品にすべての機能を統合し、外部システムへの依存をなくす考え方"
      - id: c
        label: "パーティションの数を1つに減らし、単一ノード構成に戻す考え方"
      - id: d
        label: "レプリケーションを廃止し、単一障害点を許容する考え方"
      - id: a
        label: "単一のデータベース製品が担っていた役割を、用途ごとに特化した複数の専用データシステムに分解し、それらを組み合わせて全体を構成する考え方"
    correctOptionIds: ["a"]
    explanation: "アンバンドリングは、検索・キャッシュ・分析ストアなど用途ごとに特化したシステムへ役割を分解し、組み合わせて使う発想である。"

  - id: q2-unbundling-connector
    type: single
    prompt: "アンバンドリングされた複数の専用データシステムに、一次データベースの変更を継続的に反映する仕組みとして本モジュールで説明されたものはどれか。"
    options:
      - id: a
        label: "手動での定期的な一括コピー作業のみ"
      - id: b
        label: "変更データキャプチャ(CDC)を起点にしたバッチ処理・ストリーム処理"
      - id: c
        label: "全ての派生データシステムを1つのトランザクション内で同期更新する仕組み"
      - id: d
        label: "アンバンドリングでは派生データシステム間の連携は不要である"
    correctOptionIds: ["b"]
    explanation: "一次データベースへの変更をCDCとして抽出し、バッチ処理(作り直し)やストリーム処理(継続的な差分反映)で各派生データシステムに伝えるのが典型的な構成である。"

  - id: q3-end-to-end-argument
    type: single
    prompt: "エンドツーエンド原則の考え方として最も近いものはどれか。"
    options:
      - id: b
        label: "アプリケーション要件としての正しさの保証は、下位層に完全には肩代わりさせられず、最終的には通信の両端(アプリケーション自身)が責任を持つ必要がある"
      - id: a
        label: "TCPなど下位層の信頼性を高めれば、アプリケーション側は正しさを一切気にする必要がない"
      - id: c
        label: "エンドツーエンドの暗号化さえ導入すれば、重複実行の問題は自動的に解消する"
      - id: d
        label: "ネットワーク層の再送機能を無効化すれば、重複リクエストは発生しなくなる"
    correctOptionIds: ["b"]
    explanation: "下位層の保証は有用な最適化だが、正しさの十分条件にはならず、最終的な保証はアプリケーションの両端で設計する必要がある。"

  - id: q4-idempotency-key
    type: single
    prompt: "リクエストの重複実行を防ぐための、end-to-endの視点に沿った設計はどれか。"
    options:
      - id: b
        label: "クライアントが冪等性キーを発行し、サーバー側が同じキーの再実行を新規処理として扱わないようにする"
      - id: a
        label: "ネットワークが十分信頼できるよう、再送を完全に禁止する"
      - id: c
        label: "サーバー側のタイムアウト時間をゼロに設定する"
      - id: d
        label: "全てのリクエストを同期的に1台のノードで直列実行する"
    correctOptionIds: ["b"]
    explanation: "冪等性キーによって、途中経路で再送が起きても最終的な効果が1回分に保たれるよう、アプリケーション側(end)で重複を吸収する設計である。"

  - id: q5-uniqueness-across-partitions
    type: single
    prompt: "パーティション化・アンバンドリングされた環境で一意性制約を実務上担保しやすくする典型的な工夫はどれか。"
    options:
      - id: b
        label: "一意性の検証を諦め、重複の発生を許容する"
      - id: c
        label: "全パーティションを1台のノードに統合し直す"
      - id: a
        label: "一意性を保証したいキーをパーティションキー(の一部)に含め、同じキーが必ず同じパーティションに書き込まれるようにする"
      - id: d
        label: "派生データ側にだけ一意性制約をかけ、一次データベース側は制約なしにする"
    correctOptionIds: ["a"]
    explanation: "一意性を保証したいキーをパーティションキーに含めることで、パーティション単位のローカルな制約だけで実質的な一意性を担保しやすくなる。"

  - id: q6-event-sourcing
    type: single
    prompt: "イベントソーシング型のデータ保持が、単純な上書き型と比べて優れている点はどれか。"
    options:
      - id: a
        label: "常に上書き型よりストレージ使用量が少ない"
      - id: b
        label: "何が、いつ、どういう順序で起きたかがログとして残るため、過去の状態の再現や異常値の原因追跡がしやすい"
      - id: c
        label: "上書き型よりも常に読み取りレイテンシが低い"
      - id: d
        label: "イベントの順序を考慮する必要がなくなる"
    correctOptionIds: ["b"]
    explanation: "イベントソーシングは変更の履歴そのものをログとして保持するため、監査可能性(後から原因を追跡できること)に強みがある。"

  - id: q7-derived-data-reproducibility
    type: single
    prompt: "派生データの再現性が成り立つために欠かせない性質はどれか。"
    options:
      - id: a
        label: "派生データを作る変換処理が冪等であること(同じ入力に対して何度実行しても同じ結果になること)"
      - id: b
        label: "派生データシステムの台数が一次データベースより多いこと"
      - id: c
        label: "変換ロジックを一切変更しないこと"
      - id: d
        label: "一次データベースがリレーショナルモデルであること"
    correctOptionIds: ["a"]
    explanation: "変換処理が冪等でなければ、同じログから作り直しても毎回異なる結果になり得るため、作り直しによる検証(監査)が意味をなさなくなる。"

  - id: q8-auditability-not-just-logging
    type: single
    prompt: "監査可能性を実現するために「ログを取っておくだけ」では不十分な理由として適切なものはどれか。"
    options:
      - id: a
        label: "ログから実際に状態を再構築し、元の状態と突き合わせて比較できる仕組みまで含めて設計する必要があるため"
      - id: b
        label: "ログはディスク容量を消費するため、本番環境では保存してはいけないため"
      - id: c
        label: "ログを取ると必ずレプリケーションラグが発生するため"
      - id: d
        label: "監査可能性はイベントソーシングを使わない限り原理的に実現できないため"
    correctOptionIds: ["a"]
    explanation: "ログを保持するだけでなく、そこから状態を再構築し比較できる仕組みまで用意して初めて、監査可能性として機能する。"
