questions:
  - id: q1
    prompt: "フォールトトレラントな設計が目指していることとして最も適切なものはどれか?"
    type: single
    options:
      - id: a
        label: "フォールトが発生する確率を完全にゼロにすること"
      - id: b
        label: "個々のフォールトが発生しても、システム全体としてはサービス提供を継続できるようにすること"
      - id: c
        label: "ハードウェアだけを高性能なものに置き換え続けること"
      - id: d
        label: "障害対応の手順書を作らず、その場で対応すること"
    correctOptionIds: [b]
    explanation: "フォールトトレランスは、フォールトの発生自体をゼロにすることではなく、個々のフォールトが全体の障害に発展しないように設計することを指す。"
  - id: q2
    prompt: "ソフトウェア障害がハードウェア障害より対処が難しいとされる理由として最も適切なものはどれか?"
    type: single
    options:
      - id: a
        label: "ソフトウェア障害は発生確率がハードウェア障害よりも常に高いため"
      - id: b
        label: "同じバグを持つ複数のインスタンスが同時に不調になるなど、相関して発生しやすいため"
      - id: c
        label: "ソフトウェア障害は必ず人為的ミスが原因であるため"
      - id: d
        label: "ソフトウェア障害はネットワーク分断でしか発生しないため"
    correctOptionIds: [b]
    explanation: "ハードウェア障害の多くは各マシンで独立して起きるのに対し、ソフトウェア障害は同一のバグを持つ複数のインスタンスで同時に発火しうるなど、相関して発生しやすい。"
  - id: q3
    prompt: "「負荷パラメータ」の説明として最も適切なものはどれか?"
    type: single
    options:
      - id: a
        label: "すべてのシステムに共通する唯一の負荷指標であり、常に秒あたりリクエスト数を使えばよい"
      - id: b
        label: "システムのアーキテクチャに応じて選ぶ、負荷の大きさを表す指標(リクエスト数、同時接続数、読み書き比率など)"
      - id: c
        label: "システムが利用できるメモリ容量のことを指す"
      - id: d
        label: "障害発生時にのみ計測する指標のことを指す"
    correctOptionIds: [b]
    explanation: "負荷パラメータはシステムのアーキテクチャによって意味を持つ指標が変わるため、リクエスト数、同時接続数、読み書き比率などから、そのシステムにとって意味のあるものを選ぶ必要がある。"
  - id: q4
    prompt: "スループットと応答時間の関係として最も適切な説明はどれか?"
    type: single
    options:
      - id: a
        label: "スループットが高ければ応答時間も自動的に短くなる、常に連動する指標である"
      - id: b
        label: "スループットは処理能力、応答時間は1件が完了するまでの体感時間であり、独立に変動しうる別の指標である"
      - id: c
        label: "応答時間はスループットの逆数として定義される固定の関係にある"
      - id: d
        label: "どちらも同じ意味の言葉で、使い分ける必要はない"
    correctOptionIds: [b]
    explanation: "スループットは単位時間あたりの処理件数、応答時間は1件のリクエストが完了するまでの時間であり、キューでの待ち時間などにより独立に変動しうる。"
  - id: q5
    prompt: "p99レイテンシが500msであるとは、どういう意味か?"
    type: single
    options:
      - id: a
        label: "すべてのリクエストが500ms以内に完了する"
      - id: b
        label: "リクエストの99%が500ms以内に完了し、残り1%はそれより遅い"
      - id: c
        label: "平均応答時間が500msである"
      - id: d
        label: "リクエストの99%が500msより遅い"
    correctOptionIds: [b]
    explanation: "p99は、測定値を小さい順に並べたときに99%がその値以下に収まる境界であり、残り1%はそれより遅いことを意味する。"
  - id: q6
    prompt: "1件のリクエストが多数のバックエンド呼び出しを並列(ファンアウト)で発行する構成で、並列呼び出しの本数が増えるとテールレイテンシが増幅するのはなぜか?"
    type: single
    options:
      - id: a
        label: "並列呼び出しの本数が増えるほど、システム全体のスループットが下がる法則があるため"
      - id: b
        label: "リクエスト全体の応答時間は最も遅い呼び出しに一致し、本数が増えるほど遅い外れ値を少なくとも1本引く確率が高まるため"
      - id: c
        label: "並列呼び出しは常にp50をp99より大きくしてしまうため"
      - id: d
        label: "ファンアウトを行うと個々の呼び出しのレイテンシが物理的に長くなるため"
    correctOptionIds: [b]
    explanation: "リクエスト全体の応答時間は並列呼び出しのうち最も遅いものに一致するため、呼び出し本数が増えるほど、どれか1本が遅い外れ値を引く確率が高まり、体感される遅延の分布が悪化する。"
  - id: q7
    prompt: "保守性を構成する「単純性」と「発展性」の違いとして最も適切な説明はどれか?"
    type: single
    options:
      - id: a
        label: "単純性は今のコードやアーキテクチャの複雑さを減らすことに焦点があり、発展性は将来の要件変化に安全かつ低コストで対応できることに焦点がある"
      - id: b
        label: "単純性と発展性はまったく同じ概念であり、区別する意味はない"
      - id: c
        label: "単純性はハードウェアの冗長化、発展性はソフトウェアのバージョン管理のみを指す"
      - id: d
        label: "発展性は運用時の監視のしやすさのみを指す言葉である"
    correctOptionIds: [a]
    explanation: "単純性は偶発的複雑性を減らして今の見通しをよくすることに、発展性は将来の変更を安全かつ低コストで行えるようにすることに、それぞれ焦点がある補完的な性質である。"
